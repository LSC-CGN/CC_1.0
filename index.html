  const DEFAULT_MASS=[{id:"m1",tmpl:"nacht",status:"umgesetzt",name:"Nachtabsenkung HVAC Halle A+B",traeger:"gas",invest:11800,kwh:175000,co2t:35,life:12,prio:"hoch",start:"Q1 2025",verant:"M. Kreuz"},{id:"m2",tmpl:"led",status:"umsetzung",name:"LED-Umrüstung Halle C",traeger:"strom",invest:42000,kwh:96000,co2t:36,life:15,prio:"mittel",start:"Q2 2026",verant:"Instandhaltung"},{id:"m3",tmpl:"leck",status:"geplant",name:"Leckage-Ortung Druckluft",traeger:"strom",invest:18000,kwh:95000,co2t:36,life:8,prio:"hoch",start:"Q3 2026",verant:"Energieteam"},{id:"m4",tmpl:"pv",status:"geplant",name:"PV-Anlage Dach Halle A",traeger:"strom",invest:320000,kwh:380000,co2t:144,life:25,prio:"strategisch",start:"Q4 2026",verant:"GF"}];
  const [list,setList]=useState(()=>{try{const s=localStorage.getItem("gm_mass");return s?JSON.parse(s):DEFAULT_MASS;}catch{return DEFAULT_MASS;}});
  const [selId,setSelId]=useState("m3");
  const [filter,setFilter]=useState("all");
  const [scenario,setScenario]=useState("real"); // best / real / worst
  const [showNew,setShowNew]=useState(false);
  const [newMode,setNewMode]=useState("tmpl"); // "tmpl" | "calc"
  const [newCalc,setNewCalc]=useState({name:"",traeger:"strom",invest:25000,kwh:27400,preis:0.28,zins:5,pst:3,life:10,rest:0,co2f:0.41,prio:"mittel",start:"Q4 2026"});
  const [planMode,setPlanMode]=useState(null);
  const [kiPlanInput,setKiPlanInput]=useState("");
  const [kiBusy,setKiBusy]=useState(false);
  const [kiSuggestion,setKiSuggestion]=useState(null);
  useEffect(()=>{try{localStorage.setItem("gm_mass",JSON.stringify(list));}catch{}},[list]);
  useEffect(()=>{
    if(!sel) return;
    setNewCalc(prev=>({
      ...prev,
      name:sel.name,
      traeger:sel.traeger,
      invest:sel.invest,
      kwh:sel.kwh,
      preis:({strom:stamm.strompreis,gas:stamm.gaspreis,oel:stamm.oelpreis,fernwaerme:stamm.fernwaermepreis}[sel.traeger]||stamm.strompreis)/100,
      life:sel.life,
      prio:sel.prio,
      start:sel.start,
      co2f:sel.kwh>0?+(sel.co2t*1000/sel.kwh).toFixed(3):0.41
    }));
  },[selId]);

  const sel=list.find(m=>m.id===selId);
  const visible=list.filter(m=>filter==="all"||m.status===filter);

  // Preis je Energieträger
  const priceForTraeger=(t)=>({strom:stamm.strompreis,gas:stamm.gaspreis,oel:stamm.oelpreis,fernwaerme:stamm.fernwaermepreis}[t]||stamm.strompreis)/100;

  // Berechnungen mit Szenario-Faktor
  const scFactor={best:1.25,real:1.0,worst:0.75}[scenario];
  function calc(m,useScenario=true){
    const f=useScenario?scFactor:1;
    const kwhEff=m.kwh*f;
    const eurSaveYear=kwhEff*priceForTraeger(m.traeger);
    const co2Year=m.co2t*f;
    return {
      kwhYear:kwhEff,
      eurYear:eurSaveYear,
      co2Year,
      npv:npv(m.invest,eurSaveYear,m.life,stamm.diskontsatz),
      irr:irr(m.invest,eurSaveYear,m.life),
      roi:roi(m.invest,eurSaveYear,m.life),
      payback:payback(m.invest,eurSaveYear)
    };
  }

  // Portfolio-Summen (Szenario "real")
  const portfolio=useMemo(()=>{
    let inv=0,kwh=0,eur=0,co2=0;
    for(const m of list){
      const c=calc(m,false);
      inv+=m.invest;kwh+=c.kwhYear;eur+=c.eurYear;co2+=c.co2Year;
    }
    return {inv,kwh,eur,co2};
  },[list,stamm]);

  function addFromTemplate(t){
    const id="m"+(Date.now()%100000);
    setList([...list,{id,tmpl:t.id,status:"geplant",name:t.label,traeger:t.traeger,invest:t.invest,kwh:t.kwh,co2t:t.co2t,life:t.life,prio:"mittel",start:"Q4 2026",verant:"—"}]);
    setSelId(id);setShowNew(false);
  }
  function addFromCalc(status="geplant"){
    if(!newCalc.name.trim()) return;
    const id="m"+(Date.now()%100000);
    const kwh=+newCalc.kwh||0;
    setList([...list,{id,tmpl:"custom",status,
      name:newCalc.name.trim(),traeger:newCalc.traeger,
      invest:+newCalc.invest||0,kwh:kwh,co2t:+(kwh*(+newCalc.co2f||0)/1000).toFixed(1),life:+newCalc.life||1,
      prio:newCalc.prio,start:newCalc.start||"Q4 2026",verant:"—"}]);
    setSelId(id);setShowNew(false);
    setNewCalc({name:"",traeger:"strom",invest:25000,kwh:27400,preis:0.28,zins:5,pst:3,life:10,rest:0,co2f:0.41,prio:"mittel",start:"Q4 2026"});
    setNewMode("tmpl");
  }
  function planWithKi(){
    if(!kiPlanInput.trim()||kiBusy) return;
    setKiBusy(true);setKiSuggestion(null);
    const sys=`Du bist ISO 50001 Energieexperte für ${FIRMA} (${stamm.branche}). Antworte NUR mit einem JSON-Objekt, kein anderer Text.`;
    const prompt=`Erstelle eine konkrete Energieeffizienzmaßnahme für: "${kiPlanInput.trim()}"
Strompreis: ${stamm.strompreis} ct/kWh, Gaspreis: ${stamm.gaspreis} ct/kWh.

JSON (genau dieses Format):
{"name":"Titel max 50 Zeichen","traeger":"strom","invest":25000,"kwh":80000,"life":12,"co2t":30,"prio":"hoch","beschreibung":"2-3 Sätze zur Maßnahme"}`;
    fetch("https://controlcenter.lschneider.workers.dev",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:400,system:sys,messages:[{role:"user",content:prompt}]})})
    .then(r=>r.json()).then(data=>{
      const raw=(data.content&&data.content[0]&&data.content[0].text)||"";
      const m=raw.match(/\{[\s\S]*\}/);
      if(m){try{setKiSuggestion(JSON.parse(m[0]));}catch{setKiSuggestion({error:"JSON-Fehler"});}}
      else setKiSuggestion({error:"Keine gueltige Antwort erhalten."});
    }).catch(e=>setKiSuggestion({error:"Netzwerkfehler: "+e.message}))
    .finally(()=>setKiBusy(false));
  }
  function acceptKiSuggestion(status="entwurf"){
    if(!kiSuggestion||kiSuggestion.error) return;
    const id="m"+(Date.now()%100000);
    const s=kiSuggestion;
    setList([...list,{id,tmpl:"ki",status,name:s.name||"KI-Maßnahme",traeger:s.traeger||"strom",
      invest:+s.invest||0,kwh:+s.kwh||0,co2t:+s.co2t||0,life:+s.life||10,
      prio:s.prio||"mittel",start:"Q4 2026",verant:"KI-Agent",beschreibung:s.beschreibung||""}]);
    setKiSuggestion(null);setKiPlanInput("");setPlanMode(null);setSelId(id);
  }

  function updateField(field,value){
    setList(list.map(m=>m.id===selId?{...m,[field]:value}:m));
  }

  const selCalc=sel?calc(sel,true):null;
  const selCalcReal=sel?calc(sel,false):null;

  const [rightW,,onDragRight]=useDragW(420,300,900,-1);
  return h("div",{style:{display:"grid",gridTemplateColumns:"minmax(0,1fr) 6px "+rightW+"px",gap:0,minHeight:"calc(100vh - 160px)"}},
    // LEFT: Liste + Portfolio
    h("div",{className:"scroll",style:{overflowY:"auto",padding:"16px 20px"}},
      // Header
      h("div",{style:{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:14}},
        h("div",null,
          h("div",{style:{fontSize:18,fontWeight:700}},"Maßnahmen"),
          h("div",{style:{fontSize:16,color:"var(--faint)",marginTop:2,fontFamily:"var(--mono)"}},"DIN 17463 Wirtschaftlichkeitsbewertung · ",list.length," Maßnahmen")),
        h("div",{style:{display:"flex",gap:6}},
          h("button",{className:"btn",onClick:()=>{setShowNew(!showNew);setPlanMode(null);}},"+ Manuell"),
          h("button",{className:"btn"+(planMode==="ki"?" active":""),onClick:()=>{setPlanMode(planMode==="ki"?null:"ki");setShowNew(false);}},"🤖 KI planen"),
          h("button",{className:"btn-b"},"Export Portfolio"))
      ),

      // Template-Picker (nur wenn "+ Neue Maßnahme" geklickt)
      showNew&&h("div",{className:"fadein",style:{marginBottom:14,padding:14,border:"1px solid var(--b)",background:"var(--s1)",borderRadius:4}},
        h("div",{style:{fontFamily:"var(--mono)",fontSize:14,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}},"Aus Template anlegen"),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}},
          MASS_TEMPLATES.map(t=>h("div",{key:t.id,onClick:()=>addFromTemplate(t),className:"tile",style:{padding:10,cursor:"pointer",textAlign:"center"}},
            h("div",{style:{fontSize:24}},t.icon),
            h("div",{style:{fontSize:16,fontWeight:600,marginTop:4,color:"var(--t)"}},t.label),
            h("div",{style:{fontSize:16,fontFamily:"var(--mono)",color:"var(--faint)",marginTop:4}},fmtEuro(t.invest)," · ",fmtKWh(t.kwh)))))),

      planMode==="ki"&&h("div",{className:"fadein",style:{marginBottom:14,padding:14,border:"1px solid var(--b)",background:"var(--s1)",borderRadius:4}},
        h("div",{style:{fontFamily:"var(--mono)",fontSize:14,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}},"KI-Maßnahmenplanung"),
        h("textarea",{value:kiPlanInput,onChange:e=>setKiPlanInput(e.target.value),
          placeholder:"Beschreibe das Einsparpotenzial oder Problem, z. B.: „Druckluftanlage Halle B hat ~30 % Leckage, ca. 15 kW Dauerlast“",
          rows:3,style:{width:"100%",padding:"8px 10px",fontSize:15,border:"1px solid var(--b)",borderRadius:3,background:"var(--s2)",color:"var(--t)",fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}),
        h("div",{style:{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}},
          h("button",{className:"btn-b",onClick:planWithKi,
            disabled:!kiPlanInput.trim()||kiBusy,
            style:{opacity:(!kiPlanInput.trim()||kiBusy)?0.5:1,cursor:(!kiPlanInput.trim()||kiBusy)?"not-allowed":"pointer"}},
            kiBusy?"KI analysiert…":"KI analysieren"),
          kiSuggestion&&!kiSuggestion.error&&h("button",{className:"btn",
            onClick:()=>{setKiPlanInput("");setKiSuggestion(null);}},"× Verwerfen")),
        kiSuggestion&&(kiSuggestion.error
          ?h("div",{style:{marginTop:10,padding:"8px 10px",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",borderRadius:3,color:"#f87171",fontSize:15}},kiSuggestion.error)
          :h("div",{className:"fadein",style:{marginTop:10,border:"1px solid var(--b)",borderRadius:4,overflow:"hidden"}},
            h("div",{style:{padding:"10px 14px",background:"var(--s3)",borderBottom:"1px solid var(--sep)"}},
              h("div",{style:{fontWeight:700,fontSize:15,color:"var(--t)"}},"🤖 "+kiSuggestion.name),
              h("div",{style:{fontSize:14,color:"var(--faint)",marginTop:4}},kiSuggestion.beschreibung)),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:10}},
              [{l:"Invest",v:fmtEuro(+kiSuggestion.invest||0)},{l:"Einsparung",v:fmtKWh(+kiSuggestion.kwh||0)+"/a"},
               {l:"Laufzeit",v:(kiSuggestion.life||10)+" a"},{l:"Priorität",v:kiSuggestion.prio||"mittel"}]
              .map((k,i)=>h("div",{key:i,style:{padding:"6px 10px",background:"var(--s2)",borderRadius:3}},
                h("div",{style:{fontSize:13,color:"var(--faint)",fontFamily:"var(--mono)",textTransform:"uppercase"}},k.l),
                h("div",{style:{fontSize:15,fontWeight:600,color:"var(--t)",marginTop:2}},k.v)))),
            h("div",{style:{display:"flex",gap:8,padding:"8px 10px",borderTop:"1px solid var(--sep)"}},
              h("button",{className:"btn",onClick:()=>acceptKiSuggestion("entwurf")},"Als Entwurf"),
              h("button",{className:"btn-b",onClick:()=>acceptKiSuggestion("geplant")},"Direkt als geplant"))))),

      // Portfolio KPIs
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
        [
          {l:"Gesamtinvest",v:fmtEuro(portfolio.inv),c:"var(--t2)",tip:"Summe aller Investitionsvolumina im Portfolio (geplant + in Umsetzung + umgesetzt)"},
          {l:"Einsparung p.a.",v:fmtEuro(portfolio.eur),c:"var(--g)",tip:"Jährliche monetäre Einsparung aller Maßnahmen zusammen · berechnet aus kWh × Energiepreis je Träger"},
          {l:"Energie p.a.",v:fmtKWh(portfolio.kwh),c:"var(--bl)",tip:"Jährliche Energieeinsparung in kWh über alle Maßnahmen · Basis für CO₂-Berechnung und EnPI-Verbesserung"},
          {l:"CO₂ p.a.",v:portfolio.co2.toFixed(0)+" t",c:"var(--bl)",tip:"Jährliche CO₂-Reduktion durch alle Portfoliomaßnahmen (Scope 1+2) · Emissionsfaktoren je Energieträger"}
        ].map((k,i)=>h("div",{key:i,className:"tile",style:{padding:"10px 14px"}},
          h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",display:"flex",alignItems:"center",gap:4}},k.l,k.tip&&h(HelpDot,{title:k.tip})),
          h("div",{style:{fontSize:16,fontWeight:700,color:k.c,marginTop:4}},k.v)))
      ),

      // Filter
      h("div",{style:{display:"flex",gap:6,marginBottom:10}},
        ["all","entwurf","geplant","umsetzung","umgesetzt","abgelehnt"].map(f=>
          h("button",{key:f,className:"btn"+(filter===f?" active":""),onClick:()=>setFilter(f)},
            f==="all"?"Alle":MASS_STATUS[f]?.l||f,
            " (",(f==="all"?list:list.filter(m=>m.status===f)).length,")"))),

      // List
      h("div",{style:{border:"1px solid var(--b)",borderRadius:4,overflow:"hidden"}},
        h("div",{style:{display:"grid",gridTemplateColumns:"minmax(140px,1.6fr) 110px 100px 110px 90px 110px 110px",columnGap:18,padding:"10px 16px",background:"var(--s3)",borderBottom:"1px solid var(--b)",fontFamily:"var(--mono)",fontSize:15,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".08em"}},
          h("span",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},"Maßnahme"),h("span",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},"Abteilung"),h("span",{style:{display:"flex",alignItems:"center",gap:2,overflow:"hidden",whiteSpace:"nowrap"}},"Invest",h(HelpDot,{title:t("Gesamtes Investitionsvolumen der Maßnahme in EUR (Anschaffung + Installation)","Total investment volume of the measure in EUR (capex + installation)")})),h("span",{style:{display:"flex",alignItems:"center",gap:2,overflow:"hidden",whiteSpace:"nowrap"}},"Einsp. p.a.",h(HelpDot,{title:t("Geschätzte jährliche monetäre Einsparung in EUR · berechnet aus kWh-Einsparung × Energiepreis je Träger","Estimated annual monetary savings in EUR · calculated as kWh savings × energy price per carrier")})),h("span",{style:{display:"flex",alignItems:"center",gap:2,overflow:"hidden",whiteSpace:"nowrap"}},"Payback",h(HelpDot,{title:t("Einfache (statische) Amortisationszeit in Jahren · Invest ÷ Einsparung p.a.","Simple (static) payback period in years · capex ÷ savings p.a.")})),h("span",{style:{display:"flex",alignItems:"center",gap:2,overflow:"hidden",whiteSpace:"nowrap"}},"NPV",h(HelpDot,{title:t("Kapitalwert nach DIN 17463 (Netto-Barwert) über die Nutzungsdauer · positiv = wirtschaftlich","Net present value per DIN 17463 over useful life · positive = economically viable")})),h("span",{style:{display:"flex",alignItems:"center",gap:2,overflow:"hidden",whiteSpace:"nowrap"}},"Status",h(HelpDot,{title:t("Bearbeitungsphase: geplant · in Umsetzung · umgesetzt · abgelehnt","Processing phase: planned · in implementation · done · rejected")}))),
        visible.map((m,i)=>{
          const c=calc(m,false);
          const isSel=selId===m.id;
          return h("div",{key:m.id,onClick:()=>setSelId(m.id),
            style:{display:"grid",gridTemplateColumns:"minmax(140px,1.6fr) 110px 100px 110px 90px 110px 110px",columnGap:18,padding:"12px 16px",
              borderBottom:i<visible.length-1?"1px solid var(--sep)":"none",cursor:"pointer",alignItems:"center",
              background:isSel?"rgba(16,185,129,.06)":"transparent",borderLeft:"3px solid "+(isSel?"var(--g)":"transparent")}},
            h("div",{style:{minWidth:0}},
              h("div",{style:{fontSize:16,color:"var(--t)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.name),
              h("div",{style:{fontSize:14,fontFamily:"var(--mono)",color:"var(--faint)",marginTop:2}},m.traeger.toUpperCase()," · ",m.start)),
            h("span",{style:{fontSize:15,color:"var(--t2)"}},m.verant),
            h("span",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--t2)"}},fmtEuro(m.invest)),
            h("span",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--g)"}},fmtEuro(c.eurYear)),
            h("span",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--t2)"}},fmtYears(c.payback)),
            h("span",{style:{fontFamily:"var(--mono)",fontSize:15,color:c.npv>=0?"var(--g)":"var(--bl)"}},fmtEuro(c.npv)),
            h("span",null,massStatusChip(m.status))
          );
        })
      ),

      // Portfolio chart
      h("div",{style:{marginTop:20,border:"1px solid var(--b)",borderRadius:4,background:"var(--s1)",padding:14}},
        h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}},"Invest vs. NPV je Maßnahme"),
        R.ResponsiveContainer&&h("div",{style:{height:220}},
          h(R.ResponsiveContainer,{width:"100%",height:"100%"},
            h(R.BarChart,{data:list.map(m=>{const c=calc(m,false);return {name:m.name.substring(0,18),invest:m.invest,npv:c.npv};}),margin:{top:10,right:10,bottom:0,left:10}},
              h("defs",null,
                h("linearGradient",{id:"maInvest",x1:0,y1:0,x2:0,y2:1},
                  h("stop",{offset:"0%",stopColor:"#60a5fa",stopOpacity:.95}),
                  h("stop",{offset:"60%",stopColor:"#3b82f6",stopOpacity:.85}),
                  h("stop",{offset:"100%",stopColor:"#1e40af",stopOpacity:.75})),
                h("linearGradient",{id:"maNpv",x1:0,y1:0,x2:0,y2:1},
                  h("stop",{offset:"0%",stopColor:"#4ade80",stopOpacity:.95}),
                  h("stop",{offset:"60%",stopColor:"#10b981",stopOpacity:.85}),
                  h("stop",{offset:"100%",stopColor:"#047857",stopOpacity:.75}))
              ),
              h(R.CartesianGrid,{strokeDasharray:"2 4",stroke:"var(--chart-grid)"}),
              h(R.XAxis,{dataKey:"name",tick:{fontSize:16,fill:"var(--t2)"},axisLine:{stroke:"var(--chart-axis)"}}),
              h(R.YAxis,{tick:{fontSize:16,fill:"var(--t2)"},axisLine:{stroke:"var(--chart-axis)"},tickFormatter:v=>(v/1000).toFixed(0)+"k"}),
              h(R.Tooltip,{cursor:false,contentStyle:{background:"var(--chart-tt-bg)",border:"1px solid #243043",fontSize:16,borderRadius:4},formatter:v=>fmtEuro(v)}),
              h(R.Bar,{dataKey:"invest",name:"Investition",fill:"url(#maInvest)",radius:[3,3,0,0]},
                h(R.LabelList,{dataKey:"invest",position:"top",fontSize:14,fill:"#93c5fd",fontFamily:"var(--mono)",formatter:v=>(v/1000).toFixed(0)+"k€"})),
              h(R.Bar,{dataKey:"npv",name:"Kapitalwert",fill:"url(#maNpv)",radius:[3,3,0,0]},
                h(R.LabelList,{dataKey:"npv",position:"top",fontSize:14,fill:"#6ee7b7",fontFamily:"var(--mono)",formatter:v=>(v/1000).toFixed(0)+"k€"}))
            )))
      ),

      // ============================================================
      // Immer sichtbarer Maßnahmen-Kalkulator (ROI + VALERI + Chart)
      // ============================================================
      (()=>{
        const inpStyle={width:"100%",padding:"8px 10px",fontSize:15,border:"1px solid var(--b)",borderRadius:3,background:"var(--s2)",color:"var(--t)",fontFamily:"inherit"};
        const lblStyle={fontSize:14,color:"var(--faint)",fontFamily:"var(--mono)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:4};
        const inv=+newCalc.invest||0, kwh=+newCalc.kwh||0, pr=+newCalc.preis||0;
        const iR=(+newCalc.zins||0)/100, rR=(+newCalc.pst||0)/100;
        const N=Math.max(1,+newCalc.life||1), rest=+newCalc.rest||0;
        const ej1=kwh*pr;
        let cum=-inv; const series=[{y:0,cum:cum}]; let bv=0;
        for(let t=1;t<=N;t++){
          const save=ej1*Math.pow(1+rR,t-1);
          const disc=save/Math.pow(1+iR,t);
          bv+=disc; cum+=disc;
          series.push({y:t,cum:cum});
        }
        const restDisc=rest/Math.pow(1+iR,N);
        const npvV=bv-inv+restDisc;
        series[series.length-1].cum=npvV;
        const ann= iR>0 ? npvV*(iR*Math.pow(1+iR,N))/(Math.pow(1+iR,N)-1) : npvV/N;
        let dynpb=null;
        for(let k=1;k<series.length;k++){
          if(series[k].cum>=0){const p=series[k-1].cum,q=series[k].cum; dynpb=(k-1)+(0-p)/(q-p); break;}
        }
        const cfs=[-inv]; for(let t=1;t<=N;t++) cfs.push(ej1*Math.pow(1+rR,t-1)+(t===N?rest:0));
        const npvAt=(x)=>cfs.reduce((a,cf,t)=>a+cf/Math.pow(1+x,t),0);
        let lo=-0.99,hi=5,irrV=null;
        if(npvAt(lo)*npvAt(hi)<0){ for(let k=0;k<80;k++){const m=(lo+hi)/2; if(npvAt(m)*npvAt(lo)<0) hi=m; else lo=m;} irrV=(lo+hi)/2; }
        const eurROI=kwh*pr;
        const pbROI= eurROI>0 ? inv/eurROI : null;
        const co2t=kwh*(+newCalc.co2f||0)/1000;
        const boxStyle={marginBottom:14,border:"1px solid var(--b)",background:"var(--s1)",borderRadius:4,overflow:"hidden"};

  ];

  const PROMPTS={
    audit:`Erstelle einen strukturierten internen Auditbericht (Entwurf) für ${FIRMA} gemäß ISO 50001 Kap. 9.2. Berichtszeitraum: ${selPeriod}. Gliederung:\n1. Auditumfang und -ziele\n2. Auditteam und Methodik\n3. Befunde je Kapitel 4–10\n4. Abweichungen und Verbesserungspotenziale\n5. Stärken\n6. Empfehlungen und Korrekturmaßnahmen\n7. Abschluss und Freigabe\nDeutsch, formell, ca. 500 Wörter.`,
    kpi:`Erstelle einen Energieleistungsbericht für ${FIRMA} (${selPeriod}) gemäß ISO 50001 Kap. 9.1. Stammdaten: Strom ${stamm.jahresverbrauchStrom.toLocaleString("de-DE")} kWh, Gas ${stamm.jahresverbrauchGas.toLocaleString("de-DE")} kWh, ${stamm.mitarbeiter} Mitarbeiter, ${stamm.produktion} t/a Produktion, ${stamm.flaeche} m² Fläche. Gliederung: 1. Executive Summary, 2. EnPI-Übersicht (7 Kennzahlen), 3. Zielabgleich, 4. Abweichungsanalyse, 5. Handlungsempfehlungen. Deutsch, ca. 400 Wörter.`,
    wirtschaft:`Erstelle eine Wirtschaftlichkeitszusammenfassung nach DIN 17463 für ${FIRMA} (${selPeriod}). Portfolio: 4 Maßnahmen, Gesamtinvest ~591.800 €, Gesamteinsparung ~263.000 €/a, ~766.000 kWh/a, ~251 t CO₂/a. Gliederung: 1. Portfolioübersicht, 2. Maßnahmen im Detail (NPV, IRR, ROI, Amortisation), 3. Szenario-Analyse Best/Worst, 4. Förderempfehlungen, 5. Priorisierung. Deutsch, ca. 450 Wörter.`,
    management:`Erstelle eine Vorlage für die Managementbewertung ${selPeriod} nach ISO 50001 Kap. 9.3 für ${FIRMA}. Alle 8 Input-Kategorien mit Leitfragen und Musterformulierungen, Output-Entscheidungen. Deutsch, formell.`,

  async function generateReport(){

        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,

          messages:[{role:"user",content:PROMPTS[selType]}]})
      });
      const data=await resp.json();
      const text=(data.content&&data.content[0]&&data.content[0].text)||"[Fehler: "+(data.error?.message||"Unbekannt")+"]";
      setGenText(text);setGenState("done");
    }catch(e){setGenText("[Netzwerkfehler: "+e.message+"]");setGenState("done");}
  }

  function exportPDF(){
    const {jsPDF}=window.jspdf||{};
    if(!jsPDF){alert("jsPDF nicht geladen");return;}
    const doc=new jsPDF({unit:"mm",format:"a4"});
    const sel=REPORT_TYPES.find(r=>r.id===selType);
    doc.setFontSize(20);doc.setTextColor(10,93,58);
    doc.text("GreenMetric ControlCenter",20,20);
    doc.setFontSize(14);doc.setTextColor(40,40,40);
    doc.text(sel.label+" · "+selPeriod,20,32);
    doc.setFontSize(10);doc.setTextColor(100,100,100);
    doc.text(FIRMA+" · Erstellt: "+new Date().toLocaleDateString("de-DE"),20,40);
    doc.setDrawColor(10,93,58);doc.setLineWidth(0.5);doc.line(20,44,190,44);
    doc.setFontSize(9);doc.setTextColor(60,60,60);
    const lines=doc.splitTextToSize(genText.replace(/#+\s/g,"").replace(/\*\*/g,""),170);
    let y=52;
    for(const line of lines){
      if(y>280){doc.addPage();y=20;}
      if(line.startsWith("# ")){doc.setFontSize(13);doc.setTextColor(10,93,58);}
      else if(line.startsWith("## ")){doc.setFontSize(11);doc.setTextColor(30,58,95);}
      else{doc.setFontSize(9);doc.setTextColor(60,60,60);}
      doc.text(line.replace(/^#+\s/,""),20,y);
      y+=line.startsWith("#")&&!line.startsWith("###")?8:5;
    }
    doc.save((sel.label+"_"+FIRMA+"_"+selPeriod+".pdf").replace(/\s/g,"_"));
  }

<style>body{font-family:Calibri,sans-serif;font-size:11pt;margin:2cm}
h1{color:#0a5d3a;font-size:16pt}h2{color:#1e3a5f;font-size:13pt}h3{font-size:11pt}

<h1>${sel.label} · ${FIRMA}</h1>
<p><em>Berichtszeitraum: ${selPeriod} · Erstellt: ${new Date().toLocaleDateString("de-DE")}</em></p>
${content.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>")}
</body></html>`;
    const blob=new Blob([html],{type:"application/vnd.ms-word"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(sel.label+"_"+FIRMA+"_"+selPeriod+".doc").replace(/\s/g,"_");
    a.click();

      if(line.startsWith("### ")) return h("div",{key:i,style:{fontSize:16,fontWeight:700,color:"var(--bl)",marginTop:12,marginBottom:4}},line.slice(4));

      if(line.startsWith("# ")) return h("div",{key:i,style:{fontSize:16,fontWeight:700,color:"var(--g)",marginBottom:8}},line.slice(2));
      if(line.startsWith("- ")) return h("div",{key:i,style:{fontSize:16,color:"var(--t2)",paddingLeft:12,lineHeight:1.6}},h("span",{style:{color:"var(--g)",marginRight:6}},"·"),line.slice(2));
      if(line.trim()==="") return h("div",{key:i,style:{height:6}});
      return h("div",{key:i,style:{fontSize:16,color:"var(--t2)",lineHeight:1.6}},line);
    });

        genState==="generating"?"KI generiert …":"Mit KI generieren"),

    )

}

// KIAssistenzHero — Agenten-Galerie im v94-Stil (Kai oben breit, 6 Spezialisten)
// ════════════════════════════════════════════════════════════════════════
function KIAssistenzHero(){
  const ctx=useContext(AppCtx);
  if(!ctx)return null;
  const {t,lang,setTab,setFloatingAgent,setFloatingMin}=ctx;
  function openAgent(id){ setFloatingAgent(id); setFloatingMin(false); }
  const kai = KI_AGENTS.find(function(a){return a.id==="kai";});
  const specialists = KI_AGENTS.filter(function(a){return a.id!=="kai";});
  const now=new Date();
  const dateStr=now.toLocaleDateString(lang==="en"?"en-GB":"de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  const urgBorderFor=function(lv){return {urgent:"#ef4444",week:"#d97706",planned:"#3b82f6",ok:"#10b981"}[lv]||"var(--b)";};
  function getIntro(ag){ return lang==="en"&&ag.introEn?ag.introEn:ag.intro; }
  function getStatus(ag){ return lang==="en"&&ag.statusMsgEn?ag.statusMsgEn:ag.statusMsg; }
  function getRole(ag){ return lang==="en"&&ag.roleEn?ag.roleEn:ag.role; }
  function getItemText(it){ return lang==="en"&&it.textEn?it.textEn:it.text; }

  // ── Kai-Karte (volle Breite) ─────────────────────────────────────
  const kaiCard = h("div",{className:"tile",style:{
    padding:"32px 36px",borderTop:"3px solid "+urgBorderFor(kai.statusLevel),
    display:"grid",gridTemplateColumns:"auto 1fr",gap:28,alignItems:"flex-start"
  }},
    // Avatar-Spalte
    h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:10,paddingTop:4}},
      h(AgentAvatar,{agent:kai,size:110,glow:true}),
      h("div",{style:{fontSize:19,fontWeight:700,color:"var(--t)",textAlign:"center"}},"Kai"),
      h("div",{style:{fontSize:13,fontFamily:"var(--mono)",color:"var(--faint)",border:"1px solid var(--b)",
                      borderRadius:3,padding:"3px 9px",whiteSpace:"nowrap"}},getRole(kai))
    ),
    // Inhalt
    h("div",{style:{display:"flex",flexDirection:"column",gap:16,minWidth:0}},
      h("div",null,
        h("div",{style:{fontSize:13,fontFamily:"var(--mono)",color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em"}},dateStr),
        h("div",{style:{fontSize:28,fontWeight:700,color:"var(--t)",marginTop:4,letterSpacing:"-.01em"}},
          t("Guten Morgen — hier ist euer Status.","Good morning — here's your status."))
      ),
      h("div",{style:{fontSize:17,color:"var(--t2)",lineHeight:1.65,fontStyle:"italic",borderLeft:"3px solid var(--b)",paddingLeft:14}},getIntro(kai)),
      h("div",null,
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          h(WStatusDot,{level:kai.statusLevel}),
          h("span",{style:{fontSize:17,fontWeight:600,color:"var(--t)"}},getStatus(kai))
        ),
        h("div",{style:{display:"flex",flexDirection:"column",gap:7}},
          ...kai.items.map(function(it,i){
            return h(WTaskLink,{key:i,item:Object.assign({},it,{text:getItemText(it)}),agentColor:kai.color,setTab:setTab,t:t});
          })
        )
      ),
      // Chat-Button
      h("div",{style:{marginTop:6,paddingTop:14,borderTop:"1px solid var(--b)"}},
        h("button",{onClick:function(){openAgent("kai");},style:{
          width:"100%",padding:"12px 16px",
          background:"var(--s1)",color:"var(--t)",
          border:"1px solid var(--b)",borderRadius:5,cursor:"pointer",
          fontSize:14,fontWeight:600,fontFamily:"var(--mono)",
          display:"flex",alignItems:"center",justifyContent:"center",gap:8,
          letterSpacing:".03em",transition:"background .15s, border-color .15s"
        },
        onMouseEnter:function(e){e.currentTarget.style.background="var(--s2)";e.currentTarget.style.borderColor=kai.color;},
        onMouseLeave:function(e){e.currentTarget.style.background="var(--s1)";e.currentTarget.style.borderColor="var(--b)";}
        },"💬 ",t("Mit Kai chatten","Chat with Kai"))
      )
    )
  );

  // ── Spezialisten-Karte ────────────────────────────────────────────
  function renderSpec(ag){
    var hasItems = ag.items && ag.items.length>0;
    return h("div",{key:ag.id,className:"tile",style:{
      padding:"28px",display:"flex",flexDirection:"column",gap:18,
      borderTop:"3px solid "+urgBorderFor(ag.statusLevel)
    }},
      // Avatar + Name + Rolle (zentriert)
      h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:10,textAlign:"center"}},
        h(AgentAvatar,{agent:ag,size:100,glow:true}),
        h("div",null,
          h("div",{style:{fontSize:22,fontWeight:700,color:"var(--t)"}},ag.name),
          h("div",{style:{fontSize:15,color:"var(--t2)",fontFamily:"var(--mono)",marginTop:3}},getRole(ag))
        )
      ),
      // Intro italics
      h("div",{style:{fontSize:15,color:"var(--t2)",lineHeight:1.65,fontStyle:"italic",borderLeft:"3px solid var(--b)",paddingLeft:12}},getIntro(ag)),
      // Status + Handlungsbedarf
      h("div",null,
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          h(WStatusDot,{level:ag.statusLevel}),
          h("span",{style:{fontSize:15,fontWeight:600,color:"var(--t)"}},getStatus(ag))
        ),
        hasItems
          ? h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
              ...ag.items.map(function(it,i){
                return h(WTaskLink,{key:i,item:Object.assign({},it,{text:getItemText(it)}),agentColor:ag.color,setTab:setTab,t:t});
              })
            )
          : h("div",{style:{fontSize:13,color:"var(--t2)",fontFamily:"var(--mono)",padding:"10px 12px",
              background:"var(--bg)",borderRadius:4,border:"1px solid var(--b)"}},
              t("Aktuell kein Handlungsbedarf.","No action needed right now."))
      ),
      // Chat-Button
      h("div",{style:{marginTop:"auto",paddingTop:14,borderTop:"1px solid var(--b)"}},
        h("button",{onClick:function(){openAgent(ag.id);},style:{
          width:"100%",padding:"11px 14px",
          background:"var(--s1)",color:"var(--t)",
          border:"1px solid var(--b)",borderRadius:5,cursor:"pointer",
          fontSize:14,fontWeight:600,fontFamily:"var(--mono)",
          display:"flex",alignItems:"center",justifyContent:"center",gap:8,
          letterSpacing:".03em",transition:"background .15s, border-color .15s"
        },
        onMouseEnter:function(e){e.currentTarget.style.background="var(--s2)";e.currentTarget.style.borderColor=ag.color;},
        onMouseLeave:function(e){e.currentTarget.style.background="var(--s1)";e.currentTarget.style.borderColor="var(--b)";}
        },"💬 ",t("Mit "+ag.name+" chatten","Chat with "+ag.name))
      )
    );
  }

  return h("div",{style:{display:"flex",flexDirection:"column",gap:24,marginBottom:24}},
    kaiCard,
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(380px,1fr))",gap:24}},
      ...specialists.map(renderSpec)
    )
  );
}

      const r=await fetch("https://controlcenter.lschneider.workers.dev",{method:"POST",

    h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},

        h("button",{key:k.id,className:"btn"+(cat===k.id?" active":""),onClick:()=>setCat(k.id)},
          k.l," (",(k.id==="all"?insights:insights.filter(i=>i.cat===k.id)).length,")"))
    ),

    // KI ad-hoc output

    }},

        padding:"6px 14px",
        background:"rgba(16,185,129,.1)",
        border:"1px solid rgba(16,185,129,.45)",
        borderRadius:20,
        fontFamily:"var(--mono)",fontSize:12,fontWeight:700,
        color:"var(--g)",letterSpacing:".12em",textTransform:"uppercase",
        whiteSpace:"nowrap"
      }},t("TEIL 2","PART 2")),
      h("div",{style:{flex:1,minWidth:0}},
        h("div",{style:{fontSize:22,fontWeight:800,color:"var(--t)",letterSpacing:"-.01em"}},

      // Wenn Filter gesetzt, nur diese Gruppe zeigen

            h("div",{style:{display:"flex",alignItems:"center",gap:10,paddingBottom:6,borderBottom:"1px solid "+CAT_C[grp.id]+"40"}},
              h("div",{style:{width:6,height:22,background:CAT_C[grp.id],borderRadius:2}}),
              h("div",{style:{flex:1,minWidth:0}},
                h("div",{style:{fontFamily:"var(--mono)",fontSize:15,fontWeight:700,color:CAT_C[grp.id],textTransform:"uppercase",letterSpacing:".1em"}},grp.l," (",items.length,")"),

                  h("div",{style:{fontSize:14,color:"var(--t)",lineHeight:1.45}},ins.act)),

                  ),
                  style:{fontSize:14,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5,padding:"6px 10px",color:"var(--g)",borderColor:"var(--g)",background:"rgba(16,185,129,.06)",width:"100%"}},
                  h(Icon,{name:"bot",size:11,color:"var(--g)"}),
                  t("Mit KI-Assistent besprechen","Discuss with AI assistant")," →")
              )).concat([
                // Inline "Mehr davon"-Kachel am Ende der Reihe
                h("button",{key:"more",onClick:()=>setAiPreload(
                    t("Gib mir weitere ","Give me more ")+grp.l.toLowerCase()+
                    t(" auf Basis meiner aktuellen Energiedaten. Max. 3 neue, konkret und messbar."," based on my current energy data. Max. 3 new ones, concrete and measurable.")
                  ),
                  style:{minWidth:0,padding:14,borderRadius:6,

    h("div",{style:{marginTop:6,padding:"10px 14px",fontSize:14,color:"var(--faint)",fontFamily:"var(--mono)",background:"var(--s3)",borderRadius:4,textAlign:"center"}},
      t("⚠ Experimenteller Bereich · KI-Interpretationen werden kontinuierlich verfeinert",

// AgentDock — schwebende KI-Team-Box (links unten, ausklappbar)
// ════════════════════════════════════════════════════════════════════════
function AgentDock({tab}){
  const ctx=useContext(AppCtx);
  if(!ctx)return null;
  const {t,lang,setFloatingAgent,setFloatingMin}=ctx;
  const [open,setOpen]=useState(false);
  function openAgent(id){ setFloatingAgent(id); setFloatingMin(false); }
  // Esc-Taste schliesst Panel
  useEffect(function(){
    if(!open) return;
    var onKey=function(e){ if(e.key==="Escape") setOpen(false); };
    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey);};
  },[open]);
  // Auf KI-Assistenz nicht zeigen (dort ist eh die volle Galerie)
  if(tab==="ki") return null;
  const relevantIds = TAB_AGENTS[tab]||[];
  if(!relevantIds.length) return null;
  const blurbObj = TAB_AGENT_BLURB[tab];
  const blurb = (blurbObj&&blurbObj[lang==="en"?"en":"de"])||"";

  // Vorschau-Avatar-Stapel (uebereinander) im eingeklappten Zustand
  const avatarStack = relevantIds.slice(0,3).map(function(aid,i){
    var ag=KI_AGENTS.find(function(a){return a.id===aid;});
    if(!ag) return null;
    return h("div",{key:aid,style:{
      marginLeft:i===0?0:-10,
      width:32,height:32,borderRadius:16,
      border:"2px solid #ffffff",
      background:"var(--s1)",
      overflow:"hidden",
      display:"flex",alignItems:"center",justifyContent:"center",
      flexShrink:0,
      zIndex:10-i
    }},h(AgentAvatar,{agent:ag,size:28}));
  });

  return [
    // Backdrop wenn offen — Klick schliesst
    open?h("div",{key:"bd",onClick:function(){setOpen(false);},style:{
      position:"fixed",inset:0,zIndex:997,
      background:"rgba(0,0,0,.3)",
      backdropFilter:"blur(2px)",
      WebkitBackdropFilter:"blur(2px)"
    }}):null,
    h("div",{key:"dock",style:{
      position:"fixed",bottom:20,left:20,zIndex:998,
      display:"flex",flexDirection:"column",alignItems:"flex-start",gap:10,
      maxWidth:340
    }},
      // Ausgeklapptes Panel
      open?h("div",{style:{
        display:"flex",flexDirection:"column",gap:7,
        background:"var(--s1)",
        border:"1px solid rgba(16,185,129,.5)",
        borderRadius:10,
        padding:14,
        boxShadow:"0 16px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(16,185,129,.15)",
        width:320,maxWidth:"calc(100vw - 40px)"
      }},
        // Header mit deutlichem X-Schliessen-Button
        h("div",{style:{
          display:"flex",alignItems:"flex-start",gap:8,
          padding:"0 0 10px",borderBottom:"1px solid var(--b)",marginBottom:6
        }},
          h("span",{className:"pulse",style:{display:"inline-block",width:9,height:9,borderRadius:5,background:"var(--g)",boxShadow:"0 0 8px var(--g)",marginTop:5,flexShrink:0}}),
          h("div",{style:{flex:1,minWidth:0}},
            h("div",{style:{fontFamily:"var(--mono)",fontSize:12,letterSpacing:".12em",fontWeight:700,color:"var(--g)",textTransform:"uppercase"}},
              t("KI hier verfügbar","AI available here")),
            h("div",{style:{fontSize:13,color:"var(--t2)",marginTop:3,lineHeight:1.45}},blurb)
          ),
          h("button",{
            onClick:function(){setOpen(false);},
            title:t("Schließen (Esc)","Close (Esc)"),
            style:{
              flexShrink:0,
              width:28,height:28,borderRadius:14,
              background:"var(--s2)",border:"1px solid var(--b)",
              color:"var(--t2)",cursor:"pointer",
              fontSize:18,fontWeight:700,lineHeight:1,
              display:"flex",alignItems:"center",justifyContent:"center",
              padding:0,fontFamily:"inherit",
              transition:"background .15s, color .15s, border-color .15s"
            },
            onMouseEnter:function(e){e.currentTarget.style.background="var(--r)";e.currentTarget.style.color="#fff";e.currentTarget.style.borderColor="var(--r)";},
            onMouseLeave:function(e){e.currentTarget.style.background="var(--s2)";e.currentTarget.style.color="var(--t2)";e.currentTarget.style.borderColor="var(--b)";}
          },"×")
        ),
        // Agent-Karten
        ...relevantIds.map(function(aid){
          var ag=KI_AGENTS.find(function(a){return a.id===aid;});
          if(!ag) return null;
          return h("button",{key:aid,
            onClick:function(){openAgent(aid);setOpen(false);},
            style:{
              display:"grid",gridTemplateColumns:"auto 1fr auto",gap:11,alignItems:"center",
              padding:"10px 14px 10px 10px",
              background:"var(--s2)",border:"1px solid "+ag.color+"40",
              borderLeft:"3px solid "+ag.color,
              borderRadius:6,cursor:"pointer",fontFamily:"inherit",textAlign:"left",
              color:"var(--t)",width:"100%",
              transition:"background .15s, transform .12s"
            },

        h("div",{style:{
          marginTop:4,padding:"6px 4px 0",
          fontFamily:"var(--mono)",fontSize:11,color:"var(--faint)",

        }},t("Klick → Chat öffnet sich · Esc oder × zum Schließen","Click → opens chat · Esc or × to close"))
      ):null,
      // Toggle-Button (immer sichtbar, prominenter)
      h("button",{
        onClick:function(){setOpen(!open);},
        title:open?t("KI-Team einklappen (Esc)","Collapse AI team (Esc)"):t("KI-Team anzeigen","Show AI team"),
        style:{
          display:"inline-flex",alignItems:"center",gap:12,
          padding:open?"12px 18px 12px 14px":"14px 20px 14px 14px",
          background:open?"var(--s2)":"linear-gradient(135deg, var(--g) 0%, #0ea5e9 100%)",
          border:open?"1px solid var(--b)":"2px solid rgba(16,185,129,.6)",
          borderRadius:32,
          color:open?"var(--t)":"#fff",
          fontFamily:"var(--mono)",fontSize:15,fontWeight:800,letterSpacing:".06em",
          cursor:"pointer",
          boxShadow:open?"0 6px 16px rgba(0,0,0,.4)":"0 8px 32px rgba(16,185,129,.55), 0 0 0 4px rgba(16,185,129,.12)",
          transition:"all .25s",
          textTransform:"uppercase",
          animation:open?"none":"agentDockPulse 2.4s ease-in-out infinite"
        }
      },
        // Avatar-Stapel als Icon
        open
          ? h("span",{style:{fontSize:20,lineHeight:1}},"×")
          : h("div",{style:{display:"flex",alignItems:"center"}},...avatarStack),
        h("span",null,open?t("Schließen","Close"):t("KI-Team","AI Team")),
        !open?h("span",{style:{
          padding:"2px 10px",
          background:"rgba(255,255,255,.25)",
          borderRadius:14,
          fontSize:13,fontWeight:800,
          color:"#fff"

      )
    )
  ];
}

function App(){
  const [tab,setTab]=useState("iso");
  const [stamm,setStamm]=useState(DEFAULT_STAMMDATEN);
  const [demoData]=useState(()=>generateDemoData());
  const [theme,setTheme]=useState("dark");
  const [lang,setLang]=useState("de");
  const t=useCallback((de,en)=>lang==="en"?(en||de):de,[lang]);

  const alarms=useMemo(()=>[
    {id:1,level:"high",title:"Kompressor 3: Grundlast nachts +22 %",ts:"heute 04:12"},
    {id:2,level:"med",title:"Lastspitze überschritten: 478 kW > 450 kW",ts:"Mi 14:15"},
    {id:3,level:"low",title:"Zähler Halle B: Messung 2h ausgefallen",ts:"Di 09:30"}
  ],[]);
  const todos=useMemo(()=>[
    {title:"Internes Audit vorbereiten",due:68},
    {title:"Managementbewertung Q2",due:42},
    {title:"Stammdaten Strompreis prüfen",due:-3},
    {title:"BAFA-Nachweis Invest. einreichen",due:15}
  ],[]);

  const activeTabLabel=TABS.find(t=>t.id===tab)?.label||"ISO-Manager";
  const [aiPreload,setAiPreload]=useState(null);
  // FloatingChat-State (KI-Agenten als schwebende Blase)
  const [floatingAgent,setFloatingAgent]=useState(null);
  const [floatingLogs,setFloatingLogs]=useState({});
  const [floatingBusy,setFloatingBusy]=useState(null);
  const [floatingMin,setFloatingMin]=useState(false);
  const clearFloatingLog=useCallback(function(id){setFloatingLogs(function(p){return Object.assign({},p,{[id]:[]});});},[]);
  const sendFloatingMessage=useCallback(async function(id,text){
    const userMsg={role:"user",text:text};
    let captured;
    setFloatingLogs(function(p){var cur=p[id]||[];captured=cur.concat([userMsg]);return Object.assign({},p,{[id]:captured});});
    setFloatingBusy(id);
    try{
      const persona=AGENT_PERSONAS[id]||AGENT_PERSONAS.kai;
      const ctx=" Firma: "+FIRMA+". Branche: "+stamm.branche+". Standort: "+stamm.standort+". Strom: "+stamm.jahresverbrauchStrom.toLocaleString("de-DE")+" kWh/Jahr. Gas: "+stamm.jahresverbrauchGas.toLocaleString("de-DE")+" kWh/Jahr. Strompreis: "+stamm.strompreis+" ct/kWh.";
      const hint=lang==="en"
        ? " Keep answers concise (2-4 sentences) in English. You are part of a 7-agent team — refer to other agents by name when relevant (Kai, Eddy, Paula, Dora, Alma, Raya, Carl)."
        : " Antworte kurz (2-4 Sätze) auf Deutsch. Du bist Teil eines 7-Agenten-Teams — verweise auf andere Agenten wenn passend (Kai, Eddy, Paula, Dora, Alma, Raya, Carl).";
      const sys=persona+hint+ctx;
      const resp=await fetch("https://controlcenter.lschneider.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:1500,system:sys,
          messages:captured.map(function(m){return {role:m.role,content:m.text};})})
      });
      const data=await resp.json();
      const out=(data.content&&data.content[0]&&data.content[0].text)||"[Fehler: "+(data.error&&data.error.message||"Unbekannt")+"]";
      setFloatingLogs(function(p){return Object.assign({},p,{[id]:captured.concat([{role:"assistant",text:out}])});});
    }catch(e){
      setFloatingLogs(function(p){return Object.assign({},p,{[id]:captured.concat([{role:"assistant",text:"[Netzwerkfehler: "+e.message+"]"}])});});
    }
    setFloatingBusy(null);
  },[lang,stamm]);

  const ctxVal={stamm,setStamm,demoData,alarms,todos,activeTab:activeTabLabel,recentContext:"",setTab,theme,setTheme,lang,setLang,t,aiPreload,setAiPreload,floatingAgent,setFloatingAgent,floatingLogs,floatingBusy,floatingMin,setFloatingMin,sendFloatingMessage,clearFloatingLog};

  const tabContent={
    iso:h(IsoManager,{setTab}),
    dok:h(Dokumentation,null),
    lg:h(Lastganganalyse,null),
    kpi:h(Kennzahlen,null),
    kv:h(Kernverbraucher,null),
    mass:h(Maßnahmen,null),
    rep:h(Reports,null),
    alrm:h(Alarme,null),
    ki:h(KiInsights,null),
    sup:h(Support,null)
  }[tab];

  return h(AppCtx.Provider,{value:ctxVal},
    h("div",{"data-theme":theme,style:{minHeight:"100vh",background:"var(--bg)",color:"var(--t)"}},
      h(BrandBar,null),
      h(TabBar,{tab,setTab}),
      h(TabAgentBar,{tab}),
      h("div",{className:"fadein",key:tab},tabContent),
      h(FloatingChat,null),
      h(AgentDock,{tab:tab})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
})();
</script>
