// ---------- Resizable panel helpers ----------
// dir=+1 for left-edge handle (drag right → grow), dir=-1 for right-edge handle (drag left → grow)
function useDragW(initial,min,max,dir){
  const [w,setW]=useState(initial);
  const st=useRef({x:0,w:0});
  const onMouseDown=useCallback((e)=>{
    st.current.x=e.clientX; st.current.w=w;
    const d=dir||1;
    const mv=(ev)=>{
      const dx=(ev.clientX-st.current.x)*d;
      const nw=Math.min(max,Math.max(min,st.current.w+dx));
      setW(nw);
    };
    const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);document.body.style.cursor="";document.body.style.userSelect="";};
    window.addEventListener("mousemove",mv);
    window.addEventListener("mouseup",up);
    document.body.style.cursor="col-resize";
    document.body.style.userSelect="none";
    e.preventDefault();
  },[w,min,max,dir]);
  return [w,setW,onMouseDown];
}
function VDragHandle({onMouseDown,title}){
  return h("div",{onMouseDown,title:title||"Spalte anpassen",
    style:{width:6,cursor:"col-resize",background:"var(--sep)",
      borderLeft:"1px solid var(--b)",borderRight:"1px solid var(--b)",
      userSelect:"none",touchAction:"none",position:"relative"},
    onMouseEnter:e=>e.currentTarget.style.background="var(--g)",
    onMouseLeave:e=>e.currentTarget.style.background="var(--sep)"
  });
}

// ---------- Demo-Daten-Generator (15-min, 2025 + 2026-Prognose) ----------
let _demoCache=null;
const PROGNOSE_START=new Date(2026,4,1,0,0,0).getTime(); // 1. Mai 2026
function generateDemoData(){
  if(_demoCache) return _demoCache;
  const startMs=new Date(2025,0,1,0,0,0).getTime();
  const endMs=new Date(2027,0,1,0,0,0).getTime(); // bis Ende 2026
  const step=15*60*1000;
  const n=Math.floor((endMs-startMs)/step);
  const data=new Array(n);
  let seed=42;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};

  for(let i=0;i<n;i++){
    const t=startMs+i*step;
    const d=new Date(t);
    const hr=d.getHours()+d.getMinutes()/60;
    const dow=d.getDay();
    const month=d.getMonth();
    const doy=Math.floor((t-startMs)/86400000);
    const isPrognose=t>=PROGNOSE_START;
    // Prognose: leichte Verbesserung ~3 % gegenüber Vorjahr
    const progFactor=isPrognose?0.97:1.0;

    const isWork=dow>=1&&dow<=5;
    let stromBase=isWork?(180+220*Math.exp(-Math.pow((hr-12)/4,2))):(140+30*Math.exp(-Math.pow((hr-13)/5,2)));
    const sommerKuehl=month>=5&&month<=8?40*Math.exp(-Math.pow((hr-14)/3,2)):0;
    stromBase+=sommerKuehl;
    stromBase*=(0.92+0.16*rnd())*progFactor;
    if(doy===87) stromBase*=1.45;
    if(doy===201) stromBase*=1.32;
    const strom=Math.max(30,stromBase)/4;

    const isHeizP=month<=3||month>=9;
    const tempFaktor=isHeizP?(1.5-0.6*Math.cos(2*Math.PI*(hr-6)/24)):0.15;
    let gasBase=isWork?(250*tempFaktor+80):(120*tempFaktor+40);
    if(doy>=12&&doy<=18) gasBase*=1.35;
    gasBase*=(0.9+0.2*rnd())*progFactor;
    const gas=Math.max(10,gasBase)/4;

    let waermeBase=isWork?(90+40*Math.exp(-Math.pow((hr-10)/5,2))):50;
    waermeBase*=(0.93+0.14*rnd())*progFactor;
    const waerme=Math.max(20,waermeBase)/4;

    data[i]={t,strom,gas,waerme,isPrognose};
  }
  _demoCache=data;
  return data;
}

// Aggregationshelfer
function aggregate(data,res){
  // res: '15min','h','d','w','m'
  if(res==='15min') return data;
  const out=[];let bucket=null;
  const keyFn={
    h:d=>{const x=new Date(d.t);x.setMinutes(0,0,0);return x.getTime()},
    d:d=>{const x=new Date(d.t);x.setHours(0,0,0,0);return x.getTime()},
    w:d=>{const x=new Date(d.t);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x.getTime()},
    m:d=>{const x=new Date(d.t);return new Date(x.getFullYear(),x.getMonth(),1).getTime()}
  }[res];
  let curKey=null;
  for(const row of data){
    const k=keyFn(row);
    if(k!==curKey){
      if(bucket)out.push(bucket);
      bucket={t:k,strom:0,gas:0,waerme:0};
      curKey=k;
    }
    bucket.strom+=row.strom;bucket.gas+=row.gas;bucket.waerme+=row.waerme;
  }
  if(bucket)out.push(bucket);
  return out;
}

// ---------- AI Bot (persistent) ----------
function AiBot(){
  const {stamm,activeTab,recentContext,t,aiPreload,setAiPreload}=useContext(AppCtx);
  const [open,setOpen]=useState(true);
  const [msg,setMsg]=useState("");
  const [log,setLog]=useState([{role:"assistant",text:"Hallo – ich bin dein KI-Energieexperte. Ich kenne deine Stammdaten, Lastgänge, Maßnahmen und den aktiven Tab. Frag mich alles zu ISO 50001, DIN 17463, BAFA-Konformität oder deiner Datenlage."}]);
  const [busy,setBusy]=useState(false);
  const inputRef=useRef(null);
  const scrollRef=useRef(null);

  useEffect(()=>{if(open&&inputRef.current)inputRef.current.focus()},[open]);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},[log,busy]);

  // aiPreload reacts to "Mit KI-Assistent besprechen"-Buttons aus anderen Tabs
  useEffect(()=>{
    if(aiPreload){
      setOpen(true);
      setMsg(aiPreload);
      setAiPreload(null);
      setTimeout(()=>{ if(inputRef.current){ inputRef.current.focus(); inputRef.current.scrollIntoView({behavior:"smooth",block:"nearest"}); } },50);
      window.scrollTo({top:0,behavior:"smooth"});
    }
  },[aiPreload]);

  async function send(){
    const text=msg.trim();
    if(!text||busy)return;
    setMsg("");
    const newLog=[...log,{role:"user",text}];
    setLog(newLog);setBusy(true);
    try{
      const sys=`Du bist der KI-Energieexperte im GreenMetric ControlCenter für ${FIRMA}. Aktueller Tab: "${activeTab}". Branche: ${stamm.branche}. Standort: ${stamm.standort}. Jahresverbrauch Strom: ${stamm.jahresverbrauchStrom.toLocaleString("de-DE")} kWh, Gas: ${stamm.jahresverbrauchGas.toLocaleString("de-DE")} kWh. Strompreis: ${stamm.strompreis} ct/kWh, Gaspreis: ${stamm.gaspreis} ct/kWh, Diskontsatz: ${stamm.diskontsatz}%. Du kennst ISO 50001 (Kap. 4-10), DIN 17463 (Kapitalwert/IRR/ROI/Amortisation) und das BAFA-Merkblatt (Besondere Ausgleichsregelung, Grüne Konditionalität). Antworte präzise, fachlich, auf Deutsch. Max. 6 Sätze, außer ausdrücklich länger gefordert.${recentContext?" Aktueller Datenkontext: "+recentContext:""}`;
      const resp=await fetch("https://controlcenter.lschneider.workers.dev",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:sys,
          messages:newLog.filter(m=>m.role!=="system").map(m=>({role:m.role,content:m.text}))})
      });
      const data=await resp.json();
      const out=(data.content&&data.content[0]&&data.content[0].text)||"[Fehler: "+(data.error&&data.error.message||"Unbekannt")+"]";
      setLog([...newLog,{role:"assistant",text:out}]);
    }catch(e){
      setLog([...newLog,{role:"assistant",text:"[Netzwerkfehler: "+e.message+"]"}]);
    }
    setBusy(false);
  }

  return h("div",{style:{position:"sticky",top:0,zIndex:50,background:"linear-gradient(180deg,var(--s1),var(--bg))",borderBottom:"1px solid var(--b)"}},
    // Header bar always visible
    h("div",{style:{display:"flex",alignItems:"center",padding:"6px 16px",gap:8}},
      h("div",{style:{display:"flex",alignItems:"center",gap:6,cursor:"pointer",whiteSpace:"nowrap"},onClick:()=>setOpen(!open)},
        h("div",{style:{display:"flex",flexDirection:"column"}},
          h("div",{style:{fontSize:16,fontWeight:600,color:"var(--t)",display:"flex",alignItems:"center",gap:6}},
            t("KI-Energieexperte","AI Energy Expert"),h(LiveDot,{color:"var(--g)",size:6})),
          h("div",{style:{fontSize:16,fontFamily:"var(--mono)",color:"var(--faint)"}},busy?t("denkt nach …","thinking …"):t("bereit","ready")+" · "+activeTab)
        )
      ),
      h("input",{ref:inputRef,value:msg,onChange:e=>setMsg(e.target.value),
        onKeyDown:e=>{if(e.key==="Enter")send(); if(e.key==="Escape")setOpen(false);},
        onFocus:()=>setOpen(true),
        placeholder:t("Frag mich etwas über deine Energiedaten …","Ask me about your energy data …"),
        style:{flex:2,maxWidth:700,padding:"7px 12px",fontSize:16,marginLeft:4}}),
      h("button",{className:"btn",onClick:send,disabled:busy,style:{display:"flex",alignItems:"center",gap:6}},
        busy?h("span",{className:"spin",style:{display:"inline-block",width:12,height:12,border:"2px solid var(--g)",borderTopColor:"transparent",borderRadius:12}}):h(Icon,{name:"send",size:12}),
        t("Senden","Send")),
      h("button",{className:"btn",onClick:()=>setOpen(!open)},open?"▲":"▼")
    ),
    // Expanded log
    open&&h("div",{ref:scrollRef,className:"scroll fadein",style:{maxHeight:340,overflowY:"auto",borderTop:"1px solid var(--sep)",padding:"10px 16px",background:"var(--s3)"}},
      log.map((m,i)=>h("div",{key:i,style:{marginBottom:10,display:"flex",gap:8}},
        h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:m.role==="user"?"var(--bl)":"var(--g)",width:40,flexShrink:0,paddingTop:2,textTransform:"uppercase"}},m.role==="user"?"Du":"KI"),
        h("div",{style:{fontSize:16,lineHeight:1.5,color:"var(--t)",whiteSpace:"pre-wrap"}},m.text)
      )),
      busy&&h("div",{style:{fontSize:16,color:"var(--faint)",fontFamily:"var(--mono)"}},"…")
    )

function WTaskLink({item,agentColor,setTab,t}){
  const d=item.days;

  const shortTab={iso:"ISO",dok:t("Dok.","Doc."),lg:t("Lastgang","Load"),kpi:"KPIs",kv:t("Verbr.","SEU"),
                  mass:t("Maßn.","Actions"),rep:t("Report","Report"),alrm:t("Alarme","Alerts"),ki:t("KI","AI"),sup:"Support"};
  return h("div",{style:{display:"grid",gridTemplateColumns:"1fr auto",gap:10,alignItems:"center",
    padding:"11px 14px",background:"var(--bg)",borderRadius:5,border:"1px solid var(--b)"}},
    h("div",{style:{display:"flex",flexDirection:"column",gap:4,minWidth:0}},
      h("span",{style:{fontSize:15,color:"var(--t)",lineHeight:1.45}},item.text),
      h("span",{style:{fontSize:13,fontFamily:"var(--mono)",color:dueCol,fontWeight:d<0?700:400}},dueStr)

function AgentAvatar({agent,size,glow}){
  // Wenn skin-Property vorhanden ist, rendere SVG-Charakter, sonst Initial-Kreis
  const useSvg = agent && agent.skin;
  const wrapStyle={
    width:size,height:size,borderRadius:size/2,
    border:"1.5px solid "+agent.color,
    boxShadow:glow?"0 0 14px "+agent.color+"80":"none",
    display:"flex",alignItems:"center",justifyContent:"center",
    overflow:"hidden",flexShrink:0,
    background:useSvg?"#fff":"linear-gradient(135deg, "+agent.color+"30, "+agent.color+"90)",
    transition:"box-shadow .25s"
  };
  if(useSvg){
    return h("div",{style:wrapStyle},
      agent.kaiStyle||agent.id==="kai"
        ? h(KaiAvatarSvg,{size:size-3})
        : h(SpecAvatarSvg,{agent:agent,size:size-3})
    );
  }
  // Fallback: Initial-Kreis (alter Look)
  return h("div",{style:Object.assign({},wrapStyle,{
    background:"linear-gradient(135deg, "+agent.color+"30, "+agent.color+"90)",
    color:"#fff",fontFamily:"var(--mono)",fontSize:Math.round(size*0.42),fontWeight:700,
    textShadow:"0 1px 2px rgba(0,0,0,.45)"
  })},agent.name.slice(0,1));
}

// InfoTip — eingekreistes Fragezeichen mit Erläuterungs-Popover
// ════════════════════════════════════════════════════════════════════════
function InfoTip({text,align}){
  const [open,setOpen]=useState(false);
  const isRight=align==="right";
  return h("span",{style:{position:"relative",display:"inline-flex",marginLeft:6,verticalAlign:"middle"}},
    h("button",{
      onMouseEnter:()=>setOpen(true),
      onMouseLeave:()=>setOpen(false),
      onClick:e=>{e.stopPropagation();setOpen(!open);},
      "aria-label":"Hinweis",
      style:{
        width:18,height:18,borderRadius:10,
        border:"1px solid rgba(16,185,129,.55)",
        background:"rgba(16,185,129,.08)",color:"var(--g)",
        fontFamily:"var(--mono)",fontSize:12,fontWeight:700,
        cursor:"help",padding:0,
        display:"inline-flex",alignItems:"center",justifyContent:"center",
        textTransform:"none",letterSpacing:"normal"
      }
    },"?"),
    open?h("div",{style:{
      position:"absolute",top:24,
      left:isRight?"auto":0,right:isRight?0:"auto",
      zIndex:200,
      width:300,padding:"11px 13px",
      background:"var(--s1)",
      border:"1px solid rgba(16,185,129,.4)",
      borderRadius:6,
      boxShadow:"0 8px 24px rgba(0,0,0,.5)",
      fontSize:14,color:"var(--t2)",lineHeight:1.55,
      fontWeight:400,textTransform:"none",letterSpacing:"normal",
      fontFamily:"var(--sans, inherit)"
    }},text):null
  );
}

function FloatingChat(){
  const ctx=useContext(AppCtx);
  if(!ctx)return null;
  const {floatingAgent,floatingLogs,floatingBusy,floatingMin,
         setFloatingAgent,setFloatingMin,sendFloatingMessage,clearFloatingLog,t,lang,stamm}=ctx;
  const [val,setVal]=useState("");
  const [view,setView]=useState("chat"); // "chat" | "tasks"
  const inputRef=useRef(null);
  const scrollRef=useRef(null);

  useEffect(function(){
    if(floatingAgent&&!floatingMin&&inputRef.current&&view==="chat"){
      setTimeout(function(){if(inputRef.current)inputRef.current.focus();},80);
    }
  },[floatingAgent,floatingMin,view]);
  useEffect(function(){
    if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[floatingAgent,floatingLogs,floatingBusy]);
  // Beim Agentenwechsel zurueck zum Chat-Tab
  useEffect(function(){ setView("chat"); },[floatingAgent]);

  if(!floatingAgent)return null;
  const agent=KI_AGENTS.find(function(a){return a.id===floatingAgent;});
  if(!agent)return null;
  const log=(floatingLogs&&floatingLogs[floatingAgent])||[];
  const busy=floatingBusy===floatingAgent;
  const actions=AGENT_ACTIONS[floatingAgent]||[];

  function send(){
    const text=val.trim();
    if(!text||busy)return;
    setVal("");
    sendFloatingMessage(floatingAgent,text);
  }
  function runAction(act){
    if(busy)return;
    setView("chat");
    sendFloatingMessage(floatingAgent,act.prompt);
  }

  // Minimierter Zustand: Avatar-Blase
  if(floatingMin){
    return h("button",{
      onClick:function(){setFloatingMin(false);},
      title:t("Chat mit "+agent.name+" öffnen","Open chat with "+agent.name),
      style:{position:"fixed",bottom:20,right:20,zIndex:9999,
             width:60,height:60,borderRadius:30,
             background:"linear-gradient(135deg, "+agent.color+"40, "+agent.color+"99)",
             border:"2px solid "+agent.color,
             boxShadow:"0 4px 24px "+agent.color+"60",
             cursor:"pointer",
             display:"flex",alignItems:"center",justifyContent:"center",
             color:"#fff",fontFamily:"var(--mono)",fontSize:24,fontWeight:700,
             textShadow:"0 1px 3px rgba(0,0,0,.5)"}
    },agent.name.slice(0,1));
  }

  return h("div",{style:{
    position:"fixed",bottom:20,right:20,zIndex:9999,
    width:420,maxWidth:"calc(100vw - 40px)",
    height:560,maxHeight:"calc(100vh - 90px)",
    background:"var(--s1)",border:"1px solid "+agent.color+"60",
    borderRadius:8,
    boxShadow:"0 12px 40px rgba(0,0,0,.5), 0 0 0 1px "+agent.color+"20",
    display:"flex",flexDirection:"column",overflow:"hidden",
    fontFamily:"var(--sans, inherit)"
  }},
    // Header (Avatar + Name + Tab-Switch + Buttons)
    h("div",{style:{
      display:"flex",alignItems:"center",gap:10,
      padding:"10px 12px",borderBottom:"1px solid var(--b)",
      background:"linear-gradient(135deg,"+agent.color+"22,var(--s2))"
    }},
      h(AgentAvatar,{agent:agent,size:32,glow:true}),
      h("div",{style:{flex:1,minWidth:0}},
        h("div",{style:{fontSize:15,fontWeight:700,color:"var(--t)"}},agent.name),
        h("div",{style:{fontSize:12,fontFamily:"var(--mono)",color:agent.color,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},
          busy?t("denkt nach …","thinking …"):(lang==="en"&&agent.roleEn?agent.roleEn:agent.role))
      ),
      log.length>0?h("button",{
        onClick:function(){clearFloatingLog(floatingAgent);},
        title:t("Verlauf löschen","Clear log"),
        style:{background:"none",border:"none",color:"var(--faint)",cursor:"pointer",fontSize:12,fontFamily:"var(--mono)",padding:"3px 6px"}
      },t("löschen","clear")):null,
      h("button",{onClick:function(){setFloatingMin(true);},title:t("Minimieren","Minimize"),
        style:{background:"none",border:"none",color:"var(--t2)",cursor:"pointer",fontSize:18,padding:"0 6px",lineHeight:1}},"−"),
      h("button",{onClick:function(){setFloatingAgent(null);},title:t("Schließen","Close"),
        style:{background:"none",border:"none",color:"var(--t2)",cursor:"pointer",fontSize:20,padding:"0 6px",lineHeight:1}},"×")
    ),
    // Tab-Switch
    actions.length>0?h("div",{style:{
      display:"flex",borderBottom:"1px solid var(--b)",
      background:"var(--bg)",flexShrink:0
    }},
      h("button",{onClick:function(){setView("chat");},style:{
        flex:1,padding:"8px 12px",
        background:view==="chat"?"var(--s1)":"transparent",
        border:"none",borderBottom:view==="chat"?"2px solid "+agent.color:"2px solid transparent",
        marginBottom:-1,
        color:view==="chat"?agent.color:"var(--t2)",
        fontFamily:"var(--mono)",fontSize:13,fontWeight:600,
        cursor:"pointer",letterSpacing:".05em",
        display:"flex",alignItems:"center",justifyContent:"center",gap:6
      }},"💬 "+t("Chat","Chat"),log.length>0?h("span",{style:{
        fontSize:10,padding:"1px 6px",background:agent.color+"22",borderRadius:8,color:agent.color
      }},log.length):null),
      h("button",{onClick:function(){setView("tasks");},style:{
        flex:1,padding:"8px 12px",
        background:view==="tasks"?"var(--s1)":"transparent",
        border:"none",borderBottom:view==="tasks"?"2px solid "+agent.color:"2px solid transparent",
        marginBottom:-1,
        color:view==="tasks"?agent.color:"var(--t2)",
        fontFamily:"var(--mono)",fontSize:13,fontWeight:600,
        cursor:"pointer",letterSpacing:".05em",
        display:"flex",alignItems:"center",justifyContent:"center",gap:6
      }},"⚡ "+t("Aufgaben","Tasks"),h("span",{style:{
        fontSize:10,padding:"1px 6px",background:"var(--s3)",borderRadius:8,color:"var(--faint)"
      }},actions.length))
    ):null,

    // Body
    view==="tasks"
      // ── Aufgaben-Tab: Karten-Grid ─────────────────────────────────
      ? h("div",{ref:scrollRef,className:"scroll",style:{
          flex:1,overflowY:"auto",padding:"14px",
          display:"flex",flexDirection:"column",gap:10,
          background:"var(--bg)"
        }},
          h("div",{style:{
            fontSize:12,fontFamily:"var(--mono)",color:"var(--faint)",
            letterSpacing:".1em",textTransform:"uppercase",fontWeight:600,marginBottom:2
          }},t("1-Klick-Generatoren","One-click generators")),
          h("div",{style:{fontSize:13,color:"var(--t2)",lineHeight:1.5,marginBottom:6}},
            t("Klick auf eine Aufgabe → der Agent erstellt das Dokument live mit Claude und legt das Ergebnis im Chat ab.",
              "Click a task → the agent generates the document live with Claude and posts the result in the chat.")),
          ...actions.map(function(act){
            return h("button",{key:act.id,
              onClick:function(){runAction(act);},
              disabled:busy,
              style:{
                textAlign:"left",cursor:busy?"wait":"pointer",
                background:"var(--s1)",
                border:"1px solid var(--b)",
                borderLeft:"3px solid "+agent.color,
                borderRadius:5,padding:"12px 14px",
                display:"flex",flexDirection:"column",gap:5,
                fontFamily:"inherit",color:"var(--t)",
                opacity:busy?.6:1,
                transition:"background .15s, border-color .15s, transform .12s"
              },
              onMouseEnter:function(e){if(!busy){e.currentTarget.style.background="var(--s2)";e.currentTarget.style.borderColor=agent.color+"55";e.currentTarget.style.transform="translateX(2px)";}},
              onMouseLeave:function(e){e.currentTarget.style.background="var(--s1)";e.currentTarget.style.borderColor="var(--b)";e.currentTarget.style.transform="none";}
            },
              h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                h("span",{style:{fontSize:15,color:agent.color}},"⚡"),
                h("span",{style:{fontSize:13.5,fontWeight:700,color:"var(--t)",flex:1,minWidth:0}},act.label),
                h("span",{style:{fontSize:10,fontFamily:"var(--mono)",color:agent.color,fontWeight:600,flexShrink:0}},
                  t("Generieren →","Generate →"))
              ),
              h("div",{style:{fontSize:13,color:"var(--t2)",lineHeight:1.45}},act.desc)
            );
          }),
          busy?h("div",{style:{
            fontSize:13,color:"var(--faint)",fontFamily:"var(--mono)",
            padding:"10px 0",textAlign:"center"
          }},"⟳ "+t("KI arbeitet …","AI working …")+" — "+t("Ergebnis erscheint im Chat","result appears in chat")):null
        )
      // ── Chat-Tab: Verlauf + Pillen + Input ───────────────────────
      : [
          // Log
          h("div",{key:"log",ref:scrollRef,className:"scroll",style:{
            flex:1,overflowY:"auto",padding:"12px 14px",
            display:"flex",flexDirection:"column",gap:9,
            fontSize:14,lineHeight:1.55,background:"var(--bg)"
          }},
            log.length===0?h("div",{style:{
              fontSize:14,color:"var(--t2)",fontStyle:"italic",lineHeight:1.5
            }},t("Hi, ich bin "+agent.name+". "+(lang==="en"&&agent.blurbEn?agent.blurbEn:agent.blurb),
                  "Hi, I'm "+agent.name+". "+(lang==="en"&&agent.blurbEn?agent.blurbEn:agent.blurb))):null,
            log.length===0&&actions.length>0?h("div",{style:{
              fontSize:13,color:"var(--faint)",marginTop:8,fontFamily:"var(--mono)"
            }},"💡 "+t("Tipp: Tab '⚡ Aufgaben' für 1-Klick-Generatoren","Tip: tab '⚡ Tasks' for one-click generators")):null,
            ...log.map(function(m,i){return h("div",{key:i,style:{display:"flex",gap:8}},
              h("div",{style:{fontFamily:"var(--mono)",fontSize:10,
                color:m.role==="user"?"var(--bl)":agent.color,
                width:30,flexShrink:0,paddingTop:2,textTransform:"uppercase",fontWeight:700,letterSpacing:".05em"}},
                m.role==="user"?t("Du","You"):agent.name.slice(0,3)),
              h("div",{style:{flex:1,minWidth:0,color:"var(--t)",whiteSpace:"pre-wrap",wordBreak:"break-word",fontSize:14}},m.text)
            );}),
            busy?h("div",{style:{fontSize:13,color:"var(--faint)",fontFamily:"var(--mono)"}},
              agent.name.slice(0,3).toUpperCase()+" …"):null
          ),
          // Pillen (Quick-Aktionen) — nur wenn welche da sind
          actions.length>0?h("div",{key:"pills",className:"scroll",style:{
            display:"flex",gap:6,padding:"6px 12px",
            borderTop:"1px solid var(--b)",
            background:"var(--s2)",
            overflowX:"auto",flexShrink:0,alignItems:"center"
          }},
            h("span",{style:{
              fontSize:9,fontFamily:"var(--mono)",color:"var(--faint)",
              letterSpacing:".1em",textTransform:"uppercase",fontWeight:700,
              flexShrink:0
            }},"⚡"),
            ...actions.map(function(act){return h("button",{key:act.id,
              onClick:function(){runAction(act);},
              disabled:busy,
              title:act.desc,
              style:{
                flexShrink:0,padding:"4px 10px",
                background:"var(--s1)",
                border:"1px solid "+agent.color+"40",
                borderRadius:14,
                color:agent.color,
                fontSize:12,fontWeight:600,
                cursor:busy?"wait":"pointer",
                fontFamily:"inherit",
                opacity:busy?.5:1,
                transition:"background .15s, border-color .15s"
              },
              onMouseEnter:function(e){if(!busy){e.currentTarget.style.background=agent.color+"15";e.currentTarget.style.borderColor=agent.color;}},
              onMouseLeave:function(e){e.currentTarget.style.background="var(--s1)";e.currentTarget.style.borderColor=agent.color+"40";}
            },act.label);})
          ):null,
          // Input
          h("div",{key:"input",style:{display:"flex",gap:6,padding:"10px 12px",borderTop:"1px solid var(--b)",background:"var(--s1)"}},
            h("input",{ref:inputRef,value:val,

              placeholder:t("Frag "+agent.name+" …","Ask "+agent.name+" …"),

                     background:"var(--bg)",border:"1px solid var(--b)",borderRadius:4,
                     color:"var(--t)",fontFamily:"inherit",outline:"none"}

            h("button",{onClick:send,disabled:busy,
              style:{padding:"7px 13px",background:agent.color,color:"#fff",
                     border:"none",borderRadius:4,
                     cursor:busy?"wait":"pointer",fontSize:14,fontWeight:700,
                     fontFamily:"var(--mono)",letterSpacing:".03em",
                     opacity:busy?.55:1}
            },t("Senden","Send"))
          )
        ]
  );
}


function IsoManager({setTab}){

  const [expandedCh,setExpandedCh]=useState(null);
  useEffect(()=>{const id=setInterval(()=>setLiveTs(new Date()),30000);return()=>clearInterval(id);},[]);
  const fmtTime=d=>d.toLocaleTimeString(lang==="en"?"en-GB":"de-DE",{hour:"2-digit",minute:"2-digit"});
  const fmtDate=d=>d.toLocaleDateString(lang==="en"?"en-GB":"de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const fmtDateLong=d=>d.toLocaleDateString(lang==="en"?"en-GB":"de-DE",{day:"2-digit",month:"short",year:"numeric"});

  // === Compliance countdowns ===
  const certExpiry=new Date(2027,2,15);
  const daysTo=(d)=>Math.round((d-liveTs)/86400000);
  const daysToCert=daysTo(certExpiry);
  const mgmtReview=new Date(2026,5,30); const daysMR=daysTo(mgmtReview);
  const intAudit=new Date(2026,5,22);   const daysIA=daysTo(intAudit);
  const bafaDue=new Date(2026,4,15);    const daysBA=daysTo(bafaDue);

  // === Chapter status aus DEMO_DOCS ===
  const chapterStatus=ISO_STRUCT.map(ch=>{
    const docs=ch.sub.flatMap(s=>DEMO_DOCS[s.id]||[]);
    const total=docs.length;
    const current=docs.filter(d=>d.status==="aktuell").length;
    const overdue=docs.filter(d=>d.status==="überfällig").length;
    const revision=docs.filter(d=>d.status==="in_revision"||d.status==="revision").length;
    const st=overdue>0?"red":revision>0?"amber":total===0?"gray":"green";
    return {id:ch.id,label:ch.label,total,current,overdue,revision,status:st};
  });
  const readyScore=chapterStatus.length===0?0:Math.round(
    chapterStatus.reduce((a,c)=>a+(c.total>0?(c.current/c.total):0.5),0)/chapterStatus.length*100);

  // === CEO-Aktionen mit Fälligkeit ===
  const ceoActionsRaw=[
    {title:t("CAPA 2025: 2 Maßnahmen überfällig","CAPA 2025: 2 actions overdue"),due:new Date(2026,2,31),tab:"dok",kap:"10.1"},

  ].map(a=>({...a,days:daysTo(a.due)})).sort((a,b)=>a.days-b.days);
  const sevColor=(d)=>d<0?"#ef4444":d<=14?"#ef4444":d<=30?"#f59e0b":d<=90?"#eab308":"var(--g)";
  const sevLabel=(d)=>d<0?t("überfällig","overdue"):d===0?t("heute","today"):d<=1?t("morgen","tomorrow"):"in "+d+" "+t("Tagen","days");

  // === PDCA-Phasen-Mapping ===
  const pdcaPhases=[
    {phase:"Plan",clauses:["4","5","6"],color:"#10b981",nav:"dok"},
    {phase:"Do",  clauses:["7","8"],    color:"#3b82f6",nav:"mass"},
    {phase:"Check",clauses:["9"],       color:"#f59e0b",nav:"rep"},
    {phase:"Act", clauses:["10"],       color:"#ef4444",nav:"dok"}
  ];
  const pdcaProgress=pdcaPhases.map(ph=>{
    const chs=chapterStatus.filter(c=>ph.clauses.includes(c.id));
    const tot=chs.reduce((a,c)=>a+c.total,0);
    const cur=chs.reduce((a,c)=>a+c.current,0);
    const pct=tot>0?Math.round(cur/tot*100):0;
    return {...ph,pct,cur,tot};
  });

  // === Compliance-Fahrplan (chronologisch) ===
  const fahrplanItems=[
    {date:new Date(2026,1,15), title:t("Energetische Bewertung 2025","Energy review 2025"),kap:"6.3",tab:"dok"},
    {date:new Date(2026,2,28), title:t("EnPI-Review Q1 2026","EnPI review Q1 2026"),kap:"6.4",tab:"kpi"},
    {date:new Date(2026,3,10), title:t("Dokumentenlenkung \u00b7 Revision","Document control \u00b7 revision"),kap:"7.5",tab:"dok"},
    {date:bafaDue,             title:t("BAFA-Nachweis einreichen","Submit BAFA evidence"),kap:"\u2013",tab:"rep"},
    {date:new Date(2026,5,14), title:t("MR-Agenda finalisieren","Finalise MR agenda"),kap:"9.3",tab:"rep"},
    {date:intAudit,            title:t("Internes Audit Q2","Internal audit Q2"),kap:"9.2",tab:"dok"},
    {date:mgmtReview,          title:t("Managementbewertung","Management review"),kap:"9.3",tab:"rep"},
    {date:new Date(2026,6,15), title:t("Halbjahresbericht EnPIs","H1 EnPI report"),kap:"9.1",tab:"kpi"},
    {date:new Date(2026,8,30), title:t("EnPI-Review Q3","EnPI review Q3"),kap:"6.4",tab:"kpi"},
    {date:new Date(2026,10,30),title:t("Energiepolitik Jahres-Review","Annual energy policy review"),kap:"5.2",tab:"dok"},
    {date:new Date(2026,11,15),title:t("Zielbilanz 2026","2026 target review"),kap:"6.2",tab:"mass"},
    {date:certExpiry,          title:t("Rezertifizierung ISO 50001","ISO 50001 recertification"),kap:"\u2013",tab:"dok"}
  ].map(it=>{
    const d=daysTo(it.date);
    const st=d<0?"done":d<=60?"due":"plan";
    return {...it,days:d,st};
  }).sort((a,b)=>a.date-b.date);
  const doneCount=fahrplanItems.filter(x=>x.st==="done").length;
  const dueCount =fahrplanItems.filter(x=>x.st==="due").length;
  const planCount=fahrplanItems.filter(x=>x.st==="plan").length;

    {n:3,label:t("EnPIs & Baseline","EnPIs & baseline"),kap:"6.4 / 6.5",kpi:"\u221215,1 %",kpiSub:t("vs. Baseline 2024","vs. baseline 2024"),status:"green",tab:"kpi"},
    {n:4,label:t("Ziele & Maßnahmen","Targets & Actions"),kap:"6.2 / 8",kpi:"8 / 12",kpiSub:t("Ziele \u00b7 4 Maßnahmen live","Targets \u00b7 4 actions live"),status:"amber",tab:"mass"},
    {n:5,label:t("Audit & Mgmt-Review","Audit & MR"),kap:"9.2 / 9.3",kpi:daysIA+" / "+daysMR+" T",kpiSub:t("Audit / MR","Audit / MR"),status:daysIA<=14?"red":daysIA<=45?"amber":"green",tab:"rep"},
    {n:6,label:t("Verbesserung","Improvement"),kap:"10",kpi:"2 CAPA",kpiSub:t("überfällig","overdue"),status:"red",tab:"dok"}

  // Grünblau-Palette: red->petrol, amber->teal, green->grün (hex damit alpha-Konkatenation klappt)
  const stColor=(s)=>s==="red"?"#0891b2":s==="amber"?"#14b8a6":"#10b981";

  // === SVG PDCA-Wheel (4 Quadranten) ===
  const pdcaWheel=(()=>{
    const cx=220,cy=220,rOut=195,rIn=85;
    // Quadranten: Plan=upper-right (-90..0), Do=lower-right (0..90), Check=lower-left (90..180), Act=upper-left (180..270)
    const quads=[
      {ph:pdcaProgress[0],s:-90,e:0},
      {ph:pdcaProgress[1],s:0,  e:90},
      {ph:pdcaProgress[2],s:90, e:180},
      {ph:pdcaProgress[3],s:180,e:270}
    ];
    const arc=(s,e,rO,rI)=>{
      const sr=s*Math.PI/180,er=e*Math.PI/180;
      const x1=cx+rO*Math.cos(sr),y1=cy+rO*Math.sin(sr);
      const x2=cx+rO*Math.cos(er),y2=cy+rO*Math.sin(er);
      const x3=cx+rI*Math.cos(er),y3=cy+rI*Math.sin(er);
      const x4=cx+rI*Math.cos(sr),y4=cy+rI*Math.sin(sr);
      return "M "+x1+","+y1+" A "+rO+","+rO+" 0 0 1 "+x2+","+y2+" L "+x3+","+y3+" A "+rI+","+rI+" 0 0 0 "+x4+","+y4+" Z";
    };
    // Label-Positionen: Mitte jedes Quadranten in polar
    const labelPos=(s,e)=>{
      const m=(s+e)/2*Math.PI/180;
      // r leicht kleiner als reine Mitte — Prozent zentral im Quadrant (Phase-Name ist am Aussenrand)
      const r=(rOut+rIn)/2 - 4;
      return {x:cx+r*Math.cos(m),y:cy+r*Math.sin(m)};
    };
    // Helper: Bogenpfad AUSSERHALB des Wheel-Aussenkreises (Stempel-Stil)
    const labelR=rOut+14;
    const textArc=(startDeg,endDeg,sweepFlag)=>{
      const s=startDeg*Math.PI/180,e=endDeg*Math.PI/180;
      const x1=cx+labelR*Math.cos(s),y1=cy+labelR*Math.sin(s);
      const x2=cx+labelR*Math.cos(e),y2=cy+labelR*Math.sin(e);
      return "M "+x1+","+y1+" A "+labelR+","+labelR+" 0 0 "+sweepFlag+" "+x2+","+y2;
    };
    // Alle 4 Pfade im UHRZEIGERSINN (sweep=1) → Buchstaben-Fuss zeigt zum Mittelpunkt
    // (Stempel-/Muenz-Stil — DO und CHECK stehen für den Betrachter "kopfueber")
    const phasePaths=[
      {id:"phArc-plan", d:textArc(-85,-5,1)},
      {id:"phArc-do",   d:textArc(5,85,1)},
      {id:"phArc-check",d:textArc(95,175,1)},
      {id:"phArc-act",  d:textArc(-175,-95,1)}
    ];
    return h("svg",{width:480,height:480,viewBox:"-20 -20 480 480",style:{display:"block",margin:"0 auto",overflow:"visible"}},
      // Defs: Pfade fuer textPath + Gradient pro Quadrant für sanften Verlauf
      h("defs",null,
        ...phasePaths.map(p=>h("path",{key:p.id,id:p.id,d:p.d,fill:"none"})),
        ...quads.map((q,i)=>h("radialGradient",{key:"grad-"+i,id:"qgrad-"+i,cx:"50%",cy:"50%",r:"70%"},
          h("stop",{offset:"0%",stopColor:q.ph.color,stopOpacity:.06}),
          h("stop",{offset:"100%",stopColor:q.ph.color,stopOpacity:.22})
        ))
      ),
      // Aeusserer Stilring (dezent)
      h("circle",{cx,cy,r:rOut+4,fill:"none",stroke:"var(--b)",strokeWidth:1,opacity:.4}),
      // 4 Segmente — gleichmaessig, sauber, mit Gradient
      ...quads.map((q,i)=>{
        const pos=labelPos(q.s,q.e);
        const pathId=phasePaths[i].id;
        const kapTxt="Kap. "+(q.ph.clauses.length>1?(q.ph.clauses[0]+"-"+q.ph.clauses[q.ph.clauses.length-1]):q.ph.clauses[0]);
        const isComplete = q.ph.pct>=99;
        return h("g",{key:i,style:{cursor:"pointer"},onClick:()=>setTab(q.ph.nav)},
          // Basis-Sektor mit Gradient
          h("path",{d:arc(q.s+1.5,q.e-1.5,rOut,rIn),fill:"url(#qgrad-"+i+")",stroke:q.ph.color,strokeWidth:1.5,opacity:.85}),
          // Progress-Bogen am Aussenrand (volle Saettigung)
          h("path",{d:arc(q.s+1.5,q.s+1.5+(q.e-q.s-3)*(q.ph.pct/100),rOut,rOut-14),fill:q.ph.color,opacity:.9}),
          // Innenrand-Akzent (dezenter Strich)
          h("path",{d:arc(q.s+1.5,q.e-1.5,rIn+2,rIn),fill:q.ph.color,opacity:.5}),
          // Phase-Name als gekruemmter Text am Aussenrand
          h("text",{fontSize:20,fontWeight:800,fill:q.ph.color,fontFamily:"var(--mono)",letterSpacing:".25em",style:{pointerEvents:"none"}},
            h("textPath",{href:"#"+pathId,startOffset:"50%",textAnchor:"middle"},q.ph.phase.toUpperCase())
          ),
          // Prozent (gross, mittig)
          h("text",{x:pos.x,y:pos.y,textAnchor:"middle",fontSize:30,fontWeight:800,fill:q.ph.color,fontFamily:"var(--mono)",letterSpacing:"-.02em",style:{pointerEvents:"none"}},q.ph.pct+"%"),
          // Kap-Label kompakt
          h("text",{x:pos.x,y:pos.y+20,textAnchor:"middle",fontSize:13,fontWeight:500,fill:"var(--t2)",fontFamily:"var(--mono)",letterSpacing:".05em",style:{pointerEvents:"none"}},kapTxt),
          // Optional: Haken-Symbol wenn 100 %
          isComplete?h("text",{x:pos.x+34,y:pos.y-18,textAnchor:"middle",fontSize:14,fill:q.ph.color,style:{pointerEvents:"none"}},"\u2713"):null
        );
      }),
      // Trennlinien zwischen Sektoren (von Innen nach Aussen)
      ...quads.map((q,i)=>{
        const ang=q.s*Math.PI/180;
        return h("line",{key:"sep-"+i,
          x1:cx+rIn*Math.cos(ang),y1:cy+rIn*Math.sin(ang),
          x2:cx+rOut*Math.cos(ang),y2:cy+rOut*Math.sin(ang),
          stroke:"var(--bg)",strokeWidth:3
        });
      }),
      // Zentrum — sauberer, mit Akzent-Ring
      h("circle",{cx,cy,r:rIn+2,fill:"var(--bg)",stroke:"var(--b)",strokeWidth:1,opacity:.6}),
      h("circle",{cx,cy,r:rIn-4,fill:"var(--s1)",stroke:"var(--g)",strokeWidth:2.5}),
      h("text",{x:cx,y:cy-14,textAnchor:"middle",fontSize:12,fontWeight:600,fill:"var(--faint)",fontFamily:"var(--mono)",letterSpacing:"3px"},"READINESS"),
      h("text",{x:cx,y:cy+12,textAnchor:"middle",fontSize:34,fontWeight:800,fill:readyScore>=80?"#10b981":readyScore>=60?"#14b8a6":"#0891b2",fontFamily:"var(--mono)",letterSpacing:"-.02em"},readyScore+"%"),
      h("text",{x:cx,y:cy+36,textAnchor:"middle",fontSize:11,fontWeight:500,fill:"var(--t2)",fontFamily:"var(--mono)",letterSpacing:"2px"},"ISO 50001")
    );
  })();

  return h("div",{style:{padding:20,display:"flex",flexDirection:"column",gap:20}},

    // ===== COMPLIANCE HERO =====
    h("div",{className:"tile",style:{padding:"26px 30px",background:"var(--s1)",border:"1px solid var(--b)",display:"grid",gridTemplateColumns:"1.2fr 1fr 1fr 1fr 1fr",gap:24,alignItems:"center"}},
      h("div",null,
        h("div",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".14em",fontWeight:600,display:"flex",alignItems:"center",gap:6}},h(Icon,{name:"check",size:15,color:"var(--g)"}),t("Zertifiziert","Certified")),

      ),

        h("div",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".12em"}},t("Audit-Readiness","Audit readiness"),h(InfoTip,{text:t("Anteil der Pflicht-Dokumente, die aktuell und vollständig sind. >=80% = gruen (auditreif), 60–79% = orange (Nachbesserung), <60% = rot (kritisch). Direkter Indikator für Zertifizierungsbereitschaft.","Share of required documents that are current and complete. >=80% = green (audit-ready), 60–79% = orange, <60% = red.")})),

    // ===== ISO 50001 PROZESS-SCHEMA (horizontal) =====
    h("div",{className:"tile",style:{padding:"20px 22px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        h("div",{style:{fontSize:17,fontFamily:"var(--mono)",textTransform:"uppercase",letterSpacing:".12em",color:"var(--t2)",fontWeight:700}},t("ISO 50001 Prozess-Schema","ISO 50001 process"),h(InfoTip,{text:t("Die 6 Schritte des EnMS gemäß ISO 50001:2018: von Kontext & Politik bis zur kontinuierlichen Verbesserung. Klick auf einen Schritt führt zum passenden Tool-Bereich.","The 6 steps of the EnMS per ISO 50001:2018: from context & policy to continual improvement. Click a step to navigate.")})),
        h("div",{style:{fontSize:15,fontFamily:"var(--mono)",color:"var(--faint)"}},t("kontinuierlicher Verbesserungszyklus","continuous improvement cycle"))),
      h("div",{style:{display:"flex",gap:0,alignItems:"stretch",overflowX:"auto"},className:"scroll"},

        h("svg",{width:"100%",height:"100%",viewBox:"0 0 100 40",preserveAspectRatio:"none",
          style:{display:"block",overflow:"visible"}
        },
          h("defs",null,
            h("marker",{id:"isoLoopArr",viewBox:"0 0 10 10",refX:"5",refY:"5",
              markerWidth:"6",markerHeight:"6",orient:"auto"},
              h("path",{d:"M 0 0 L 10 5 L 0 10 z",fill:"var(--g)"})
            )

          // Bogen: von Mitte rechte Karte (x≈91, y=0) nach unten, links, hoch zu Mitte Karte 2 (x≈25, y=2)
          h("path",{
            d:"M 91 0 C 91 24, 91 28, 78 28 L 38 28 C 25 28, 25 24, 25 4",
            fill:"none",stroke:"var(--g)",strokeWidth:"1.4",
            strokeDasharray:"4 3",strokeLinecap:"round",

            markerEnd:"url(#isoLoopArr)"
          })

        // Label freischwebend mittig
        h("div",{style:{
          position:"absolute",left:"50%",top:"68%",transform:"translate(-50%,-50%)",
          fontSize:12,color:"var(--faint)",fontFamily:"var(--mono)",
          background:"var(--s1)",padding:"2px 12px",whiteSpace:"nowrap",
          letterSpacing:".03em",borderRadius:3
        }},t("Erkenntnisse fließen zurück","Findings feed back"))
      )
    ),

    // ===== PDCA-RAD + Kapitel-Status =====
    h("div",{style:{display:"grid",gridTemplateColumns:"auto 1fr",gap:16}},
      h("div",{className:"tile",style:{padding:18,display:"flex",flexDirection:"column",alignItems:"center"}},
        h("div",{style:{fontSize:17,fontFamily:"var(--mono)",textTransform:"uppercase",letterSpacing:".12em",color:"var(--t2)",marginBottom:4,alignSelf:"flex-start"}},t("PDCA-Zyklus","PDCA cycle"),h(InfoTip,{text:t("Plan – Do – Check – Act: Der ISO 50001-Verbesserungszyklus. Jedes Kapitel der Norm gehört zu einer Phase. Der Ring zeigt den Status pro Phase basierend auf den Dokumenten.","Plan – Do – Check – Act: The ISO 50001 improvement cycle. Each clause belongs to a phase. The ring shows the status per phase based on documents.")})),
        h("div",{style:{fontSize:16,color:"var(--faint)",fontFamily:"var(--mono)",marginBottom:8,alignSelf:"flex-start"}},t("Plan \u2192 Do \u2192 Check \u2192 Act \u2192 Plan \u2026","Plan \u2192 Do \u2192 Check \u2192 Act \u2192 Plan \u2026")),
        pdcaWheel,
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginTop:14,width:"100%"}},
          ...pdcaProgress.map(ph=>h("div",{key:ph.phase,onClick:()=>setTab(ph.nav),style:{cursor:"pointer",fontSize:16,padding:"6px 10px",borderRadius:4,background:ph.color+"15",borderLeft:"3px solid "+ph.color,fontFamily:"var(--mono)",color:"var(--t2)"}},
            h("span",{style:{fontWeight:700,color:ph.color}},ph.phase)," \u00b7 ",ph.cur+"/"+ph.tot+" "+t("Dok.","docs")))
        )
      ),
      h("div",{className:"tile",style:{padding:18}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
          h("div",{style:{fontSize:17,fontFamily:"var(--mono)",textTransform:"uppercase",letterSpacing:".12em",color:"var(--t2)"}},t("ISO-Kapitel-Status (4\u201310)","ISO clauses status (4\u201310)"),h(InfoTip,{text:t("Status der Pflicht-Dokumente pro ISO-Kapitel (4 bis 10). Klicke auf eine Zeile, um die einzelnen Unterklauseln und ihre Dokumente einzusehen. Klick auf ein Dokument oeffnet die Dokumentation.","Status of required documents per ISO clause (4-10). Click a row to view sub-clauses and their documents.")})),

        h("div",{style:{display:"flex",flexDirection:"column",gap:7}},
          ...chapterStatus.map(c=>{

            return h("div",{key:c.id,style:{borderRadius:4,background:isOpen?"var(--bg)":"var(--s2)",border:isOpen?"1px solid "+col+"40":"1px solid transparent",transition:"background .15s"}},

// ---------- Sparkline ----------
function Sparkline({color="var(--g)",height=28,vals,withAxis=false,unit=""}){
  if(!R.ResponsiveContainer) return h("div",{style:{height}});
  const data=vals&&vals.length
    ? vals.map((v,i)=>({v:+v.toFixed(0),l:["J","F","M","A","M","J","J","A","S","O","N","D"][i]||""}))
    : Array.from({length:12},(_,i)=>({v:50+30*Math.sin(i/3)+15*Math.sin(i/1.5+1),l:""}));
  const hasLabels=vals&&vals.length;
  const gid="spk"+(color==="var(--g)"?"g":"b");
  return h("div",{style:{height,marginTop:8,overflow:"visible"}},
    h(R.ResponsiveContainer,{width:"100%",height:"100%"},
      h(hasLabels?R.BarChart:R.AreaChart,{data,margin:{top:4,right:4,bottom:4,left:withAxis?0:2},barSize:withAxis?12:10},
        h("defs",null,h("linearGradient",{id:gid,x1:"0",y1:"0",x2:"0",y2:"1"},
          h("stop",{offset:"0",stopColor:color,stopOpacity:.95}),
          h("stop",{offset:"1",stopColor:color,stopOpacity:.35}))),
        hasLabels&&h(R.XAxis,{dataKey:"l",tick:{fontSize:14,fill:"var(--t2)"},axisLine:false,tickLine:false,height:22,tickMargin:4,interval:0,padding:{left:4,right:4}}),
        withAxis&&h(R.YAxis,{tick:{fontSize:12,fill:"var(--faint)"},axisLine:false,tickLine:false,width:42,tickMargin:2,tickCount:4,tickFormatter:(v)=>v>=1000?(v/1000).toFixed(1)+"k":v>=100?Math.round(v):String(v)}),
        withAxis&&h(R.Tooltip,{cursor:{fill:"rgba(255,255,255,.04)"},wrapperStyle:{outline:"none",zIndex:10},
          contentStyle:{background:"var(--s1)",border:"1px solid var(--b)",fontSize:14,borderRadius:4,color:"var(--t)",padding:"4px 8px"},
          itemStyle:{color:"var(--t)",padding:0},labelStyle:{color:"var(--faint)",marginBottom:2},
          formatter:(v)=>[v.toLocaleString("de-DE")+(unit?" "+unit:""),""],
          separator:""}),
        hasLabels
          ? h(R.Bar,{dataKey:"v",fill:"url(#"+gid+")",radius:[2,2,0,0],isAnimationActive:false})
          : h(R.Area,{type:"monotone",dataKey:"v",stroke:color,fill:"url(#"+gid+")",strokeWidth:1.5,dot:false})
      )
    )
  );
}

        h("div",{style:{display:"grid",gridTemplateColumns:"minmax(0,2.5fr) 90px 110px 130px 110px",columnGap:16,padding:"8px 14px",background:"var(--s3)",borderBottom:"1px solid var(--b)",fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em"}},
          h("span",null,"Dokument"),h("span",null,"Version"),h("span",null,"Stand"),h("span",null,"Autor"),h("span",null,"Status")),
        visibleDocs.map((d,i)=>{
          const isSel=selDoc===d.id;
          return h("div",{key:d.id,onClick:()=>setSelDoc(d.id),
            style:{display:"grid",gridTemplateColumns:"minmax(0,2.5fr) 90px 110px 130px 110px",columnGap:16,padding:"10px 14px",
              borderBottom:i<visibleDocs.length-1?"1px solid var(--sep)":"none",cursor:"pointer",

        h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".12em"}},"Dokumentdetails"),

        h("div",{style:{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}},
          statusChip(selectedDoc.status),

          h("span",{className:"chip"},selectedDoc.size)
        ),
        h("div",{style:{marginTop:14,padding:"10px 0",borderTop:"1px solid var(--sep)",borderBottom:"1px solid var(--sep)",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:16}},
          h("div",null,h("div",{style:{color:"var(--faint)",fontSize:16,textTransform:"uppercase",fontFamily:"var(--mono)",letterSpacing:".1em"}},"Autor"),h("div",{style:{color:"var(--t2)",marginTop:2}},selectedDoc.author)),
          h("div",null,h("div",{style:{color:"var(--faint)",fontSize:16,textTransform:"uppercase",fontFamily:"var(--mono)",letterSpacing:".1em"}},"Stand"),h("div",{style:{color:"var(--t2)",marginTop:2}},selectedDoc.date)),
          h("div",null,h("div",{style:{color:"var(--faint)",fontSize:16,textTransform:"uppercase",fontFamily:"var(--mono)",letterSpacing:".1em"}},"Kapitel"),h("div",{style:{color:"var(--g)",marginTop:2,fontFamily:"var(--mono)"}},selectedDoc.chapter||sel)),

        ),
        h("div",{style:{marginTop:12}},
          h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:6}},"Zusammenfassung"),

        ),

        h("div",{style:{marginTop:16}},

          ].map((v,i)=>h("div",{key:i,style:{display:"grid",gridTemplateColumns:"48px 92px minmax(0,1fr)",columnGap:12,padding:"6px 0",borderBottom:i<2?"1px solid var(--sep)":"none",fontSize:16,alignItems:"center"}},
            h("span",{style:{fontFamily:"var(--mono)",color:v.cur?"var(--g)":"var(--faint)"}},"v"+v.v),

            h("span",{style:{color:"var(--t2)",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},v.note)
          ))
        ),
        // KI summary
        h("div",{style:{marginTop:16,padding:12,background:"linear-gradient(180deg,rgba(16,185,129,.06),transparent)",border:"1px solid rgba(16,185,129,.2)",borderRadius:4}},

              kiBusy?"KI analysiert …":"KI-Analyse starten")
        ),
        // Actions

}
// ---------- Lastganganalyse ----------
function Lastganganalyse(){
  const {demoData,stamm,t}=useContext(AppCtx);
  const [traeger,setTraeger]=useState("strom");
  const [res,setRes]=useState("h");
  const [range,setRange]=useState("1m");
  const [viewMode,setViewMode]=useState("gang");
  const [selMonth,setSelMonth]=useState(3);
  const [selYear,setSelYear]=useState(2025);
  const [showPrognose,setShowPrognose]=useState(true);
  const [showAll,setShowAll]=useState(false);
  const [showCost,setShowCost]=useState(false);
  const [showRef,setShowRef]=useState(false);

  const MONAT=["Jan","Feb","M\xe4r","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const TC={strom:"var(--g)",gas:"var(--bl)",waerme:"#60a5fa"};
  const TL={strom:"Strom",gas:"Gas",waerme:"W\xe4rme"};
  const preisFkt={strom:stamm.strompreis/100,gas:stamm.gaspreis/100,waerme:stamm.fernwaermepreis/100};
  const col=TC[traeger];

  // Time window
  const rangeMs={"1w":7,"1m":31,"3m":92,"6m":183,"1j":366}[range]||31;
  const rangeEnd=new Date(selYear,selMonth+1,1).getTime();
  const rangeStart=rangeEnd-rangeMs*86400000;

  // Auto-coarsen resolution for large windows
  const effectiveRes=useMemo(()=>{
    if(res==="15min"&&rangeMs>7) return "h";
    if(res==="h"&&rangeMs>60) return "d";
    return res;
  },[res,rangeMs]);

  // Timestamp label formatter
  const fmtTs=useCallback((t)=>{
    const d=new Date(t);
    const p=n=>String(n).padStart(2,"0");
    const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
    if(effectiveRes==="15min") return p(d.getHours())+":"+p(d.getMinutes());
    if(effectiveRes==="h") return p(d.getHours())+":00";
    if(effectiveRes==="d") return DOW[d.getDay()]+" "+p(d.getDate())+"."+p(d.getMonth()+1);
    if(effectiveRes==="m") return MONAT[d.getMonth()];
    return "";
  },[effectiveRes]);

  // Main chart data (Ganglinie / Tagesprofil)
  const chartData=useMemo(()=>{
    const agg=aggregate(demoData,effectiveRes);
    return agg.filter(d=>d.t>=rangeStart&&d.t<rangeEnd).map(d=>{
      const isFc=d.t>=PROGNOSE_START;
      const v={strom:isFc?null:+(d.strom).toFixed(1),gas:isFc?null:+(d.gas).toFixed(1),waerme:isFc?null:+(d.waerme).toFixed(1)};
      return {
        ts:fmtTs(d.t),t:d.t,isFc,
        strom:v.strom, gas:v.gas, waerme:v.waerme,
        stromK:v.strom!==null?+(v.strom*preisFkt.strom).toFixed(2):null,
        gasK:v.gas!==null?+(v.gas*preisFkt.gas).toFixed(2):null,
        waermeK:v.waerme!==null?+(v.waerme*preisFkt.waerme).toFixed(2):null,
        progStrom:+(d.strom*(isFc?1:1.05)+2*Math.sin(d.t/3600000)).toFixed(1)
      };
    });
  },[demoData,effectiveRes,rangeStart,rangeEnd,fmtTs,preisFkt.strom,preisFkt.gas,preisFkt.waerme]);

  // Tagesprofil (24h average)
  const tagesprofil=useMemo(()=>{
    const agg=aggregate(demoData.filter(d=>d.t>=rangeStart&&d.t<rangeEnd&&d.t<PROGNOSE_START),"h");
    const sums=Array(24).fill(0).map(()=>({strom:0,gas:0,waerme:0,n:0}));
    for(const d of agg){const hr=new Date(d.t).getHours();sums[hr].strom+=d.strom;sums[hr].gas+=d.gas;sums[hr].waerme+=d.waerme;sums[hr].n++;}
    return sums.map((s,i)=>({
      h:String(i).padStart(2,"0")+"h",
      strom:s.n?+(s.strom/s.n).toFixed(1):0,
      gas:s.n?+(s.gas/s.n).toFixed(1):0,
      waerme:s.n?+(s.waerme/s.n).toFixed(1):0,
      stromK:s.n?+(s.strom/s.n*preisFkt.strom).toFixed(2):0,
      gasK:s.n?+(s.gas/s.n*preisFkt.gas).toFixed(2):0,
      waermeK:s.n?+(s.waerme/s.n*preisFkt.waerme).toFixed(2):0
    }));
  },[demoData,rangeStart,rangeEnd,preisFkt.strom,preisFkt.gas,preisFkt.waerme]);

  // Stats
  const stats=useMemo(()=>{
    const pts=chartData.filter(d=>!d.isFc);
    const vkey=showCost?traeger+"K":traeger;
    const vs=pts.map(d=>d[vkey]||0);
    if(!vs.length) return {sum:0,max:0,avg:0,deltaYoY:null};
    const sum=vs.reduce((a,b)=>a+b,0);
    const max=Math.max(...vs);
    const avg=sum/vs.length;
    // Year-over-year
    const pStart=rangeStart-365*86400000, pEnd=rangeEnd-365*86400000;
    const pAgg=aggregate(demoData,effectiveRes).filter(d=>d.t>=pStart&&d.t<pEnd&&d.t<PROGNOSE_START);
    const pSum=pAgg.reduce((a,b)=>a+(b[traeger]||0),0);
    const rawSum=pts.map(d=>d[traeger]||0).reduce((a,b)=>a+b,0);
    const deltaYoY=pSum>0?+((rawSum-pSum)/pSum*100).toFixed(1):null;
    return {sum,max,avg,deltaYoY};
  },[chartData,traeger,showCost,demoData,effectiveRes,rangeStart,rangeEnd]);

  // Top peaks table
  const peakData=useMemo(()=>{
    const byH=aggregate(demoData,"h").filter(d=>d.t>=rangeStart&&d.t<rangeEnd&&d.t<PROGNOSE_START);
    if(!byH.length) return [];
    const avg=byH.reduce((a,b)=>a+b[traeger],0)/byH.length;
    const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
    return [...byH].sort((a,b)=>b[traeger]-a[traeger]).slice(0,10).map((d,i)=>{
      const dt=new Date(d.t);
      const ts=DOW[dt.getDay()]+" "+dt.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+String(dt.getHours()).padStart(2,"0")+":00";
      const dev=+((d[traeger]/avg-1)*100).toFixed(1);
      const hr=dt.getHours(); const dow=dt.getDay();
      return {rank:i+1,ts,val:d[traeger].toFixed(0),dev,predicted:dow>=1&&dow<=5&&hr>=9&&hr<17,
              kosten:+(d[traeger]*preisFkt[traeger]).toFixed(2)};
    });
  },[demoData,traeger,rangeStart,rangeEnd,preisFkt]);

    const unit=showCost?"\u20ac":"kWh";
  const bigSum=showCost?stats.sum.toLocaleString("de-DE",{maximumFractionDigits:0})+"\xa0\u20ac":
    (stats.sum>100000?(stats.sum/1000).toFixed(1)+" MWh":Math.round(stats.sum).toLocaleString("de-DE")+" kWh");
  const kostenZr=(chartData.filter(d=>!d.isFc).reduce((a,d)=>a+(d[traeger]||0),0)*preisFkt[traeger]).toLocaleString("de-DE",{maximumFractionDigits:0})+" \u20ac";

  const chData=viewMode==="tages"?tagesprofil:chartData;
  const chKey=viewMode==="tages"?"h":"ts";

  // Build ComposedChart children array
  const ccChildren=[
    h(R.CartesianGrid,{strokeDasharray:"2 4",stroke:"var(--chart-grid)"}),
    h(R.XAxis,{dataKey:chKey,tick:{fontSize:16,fill:"var(--faint)"},axisLine:{stroke:"var(--chart-axis)"},interval:"preserveStartEnd"}),
    h(R.YAxis,{tick:{fontSize:16,fill:"var(--faint)"},axisLine:{stroke:"var(--chart-axis)"},unit:showCost?" \u20ac":" kWh",width:60}),
    h(R.Tooltip,{contentStyle:{background:"var(--chart-tt-bg)",border:"1px solid #243043",fontSize:16,borderRadius:4},
      cursor:{stroke:"var(--bl)",strokeWidth:1,strokeDasharray:"3 3",fill:"transparent"},
      formatter:(v,n)=>[v!=null?v+(showCost?" \u20ac":" kWh"):"Prognose",n]}),
    h(R.Legend,{wrapperStyle:{fontSize:16,color:"var(--t2)"}}),
    h("defs",null,...["strom","gas","waerme"].map(k=>
      h("linearGradient",{key:k,id:"fill_"+k,x1:"0",y1:"0",x2:"0",y2:"1"},
        h("stop",{offset:"5%",stopColor:TC[k],stopOpacity:.5}),
        h("stop",{offset:"95%",stopColor:TC[k],stopOpacity:0}))))
  ];
  if(!showAll){
    ccChildren.push(
      h(R.Area,{type:"monotone",dataKey:showCost?traeger+"K":traeger,name:TL[traeger]+(showCost?" (\u20ac)":""),
        stroke:col,fill:"url(#fill_"+traeger+")",strokeWidth:1.5,dot:false,connectNulls:false})
    );
  } else {
    ["strom","gas","waerme"].forEach(k=>ccChildren.push(
      h(R.Area,{key:k,type:"monotone",dataKey:showCost?k+"K":k,name:TL[k]+(showCost?" (\u20ac)":""),
        stroke:TC[k],fill:"url(#fill_"+k+")",strokeWidth:1.5,dot:false,fillOpacity:.25,connectNulls:false})
    ));
  }
  if(viewMode==="gang"&&showPrognose&&!showAll)
    ccChildren.push(h(R.Line,{type:"monotone",dataKey:"progStrom",name:"Prognose",
      stroke:"var(--bl)",strokeWidth:1.5,strokeDasharray:"5 3",dot:false,opacity:.7}));
  if(showRef&&viewMode==="gang")
    ccChildren.push(h(R.ReferenceLine,{y:stats.avg,stroke:"var(--bl)",strokeDasharray:"3 3",opacity:.8,
      label:{value:"\xd8\xa0"+stats.avg.toFixed(0)+" kWh",fill:"var(--bl)",fontSize:16,position:"insideTopRight"}}));

  return h("div",{style:{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}},
    // Header
    h("div",{style:{display:"flex",alignItems:"flex-end",justifyContent:"space-between"}},
      h("div",null,
        h("div",{style:{fontSize:18,fontWeight:700}},t("Lastganganalyse","Load Profile Analysis")),
        h("div",{style:{fontSize:16,color:"var(--faint)",fontFamily:"var(--mono)",marginTop:2}},
          effectiveRes+"\xa0\xb7\xa0",demoData.length.toLocaleString("de-DE")," Messpunkte\xa0\xb7\xa0Strom + Gas + W\xe4rme\xa0\xb7\xa0ISO 50001 Kap.\xa06.3")),
      h("div",{style:{display:"flex",gap:6}},
        h("button",{className:"btn"},"\u2193 Export CSV"),
        h("button",{className:"btn-b"},"Bericht"))

      h("div",{style:{display:"flex",gap:3}},
        [["15min","15min"],["h","1h"],["d","1d"],["m","1mo"]].map(([v,l])=>

            title:{"15min":"Viertelstunde","h":"Stunde","d":"Tag","m":"Monat"}[v],

      h("div",{style:{width:1,height:20,background:"var(--b)",margin:"0 4px"}}),
      h("div",{style:{display:"flex",gap:3}},
        [["1w","1W"],["1m","1M"],["3m","3M"],["6m","6M"],["1j","1J"]].map(([v,l])=>

    ),

    // Controls row 2: View mode | Options
    h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
      h("div",{style:{display:"flex",gap:4}},
        [{id:"gang",l:"Ganglinie"},{id:"tages",l:"Tagesprofil"}].map(v=>
          h("button",{key:v.id,className:"btn"+(viewMode===v.id?" active":""),onClick:()=>setViewMode(v.id)},v.l))),
      h("div",{style:{width:1,height:20,background:"var(--b)",margin:"0 4px"}}),
      h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:16,color:"var(--t2)",cursor:"pointer"}},
        h("input",{type:"checkbox",checked:showAll,onChange:e=>setShowAll(e.target.checked)}),
        "Alle Tr\xe4ger"),
      h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:16,color:"var(--t2)",cursor:"pointer"}},
        h("input",{type:"checkbox",checked:showCost,onChange:e=>setShowCost(e.target.checked)}),
        "Kosten (\u20ac)"),
      h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:16,color:"var(--t2)",cursor:"pointer"}},
        h("input",{type:"checkbox",checked:showRef,onChange:e=>setShowRef(e.target.checked)}),
        "\xd8-Referenz"),
      viewMode==="gang"&&h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:16,color:"var(--t2)",cursor:"pointer"}},
        h("input",{type:"checkbox",checked:showPrognose,onChange:e=>setShowPrognose(e.target.checked)}),

    // Main chart
    h("div",{className:"tile",style:{padding:14,overflow:"visible"}},

        h("div",{style:{fontSize:16,color:"var(--faint)",fontFamily:"var(--mono)"}},"Mo\u2013Fr 09\u201317h = Regelzeitfenster")
      ),

}

// ---------- Kennzahlen (EnPI-Matrix) ----------
function Kennzahlen(){
  const {stamm,t}=useContext(AppCtx);
  const [selTraeger,setSelTraeger]=useState("strom");
  const [selKPI,setSelKPI]=useState("prod");
  const [matSortKey,setMatSortKey]=useState("label");
  const [matSortDir,setMatSortDir]=useState(1);
  const [avgPeriod,setAvgPeriod]=useState("jahr"); // jahr|quartal|monat
  const [drillOpen,setDrillOpen]=useState(null); // null | 'ist' | 'soll'

  // Demo EnPI-Daten: Ist vs Soll, monatlich 2025
  const MONAT=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const enpiData=useMemo(()=>{
    let seed=77;
    const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
    return MONAT.map((m,i)=>({
      m,
      "strom-prod":+(210+20*Math.sin(i/3)+5*(rnd()-0.5)*8).toFixed(1),
      "strom-fl":+(28+3*Math.sin(i/3)+rnd()*4).toFixed(1),
      "strom-ma":+(17.5+2*Math.sin(i/3)+rnd()*3).toFixed(1),
      "gas-prod":+(340+50*Math.cos(i/2)+rnd()*20).toFixed(1),
      "gas-fl":+(45+12*Math.cos(i/2)+rnd()*6).toFixed(1),
      "gas-ma":+(28+8*Math.cos(i/2)+rnd()*5).toFixed(1),
      "waerme-prod":+(85+15*Math.cos(i/2)+rnd()*8).toFixed(1),
      "waerme-fl":+(11.5+3*Math.cos(i/2)+rnd()*2).toFixed(1),
      "waerme-ma":+(7.2+2*Math.cos(i/2)+rnd()*1.5).toFixed(1),
    }));
  },[]);

  // Soll-Werte (Baseline − 3 % p.a.)
  const INITIAL_SOLL={"strom-prod":200,"strom-fl":27.0,"strom-ma":17.0,"gas-prod":360,"gas-fl":48,"gas-ma":30,"waerme-prod":82,"waerme-fl":11.0,"waerme-ma":7.0};
  const [SOLL,setSOLL]=useState(INITIAL_SOLL);
  const [editSoll,setEditSoll]=useState(false);
  const [selRow,setSelRow]=useState(null);

  const KPI_DEF=[
    {id:"prod",label:"kWh / t Produktion",unit:"kWh/t"},
    {id:"fl",label:"kWh / m² Fläche",unit:"kWh/m²"},
    {id:"ma",label:"kWh / Mitarbeiter",unit:"kWh/MA"}
  ];
  const TRAEGER=[{id:"strom",l:"Strom",c:"var(--g)"},{id:"gas",l:"Gas",c:"var(--bl)"},{id:"waerme",l:"Wärme",c:"#60a5fa"}];

  const key=`${selTraeger}-${selKPI}`;
  const soll=SOLL[key];
  const latest=enpiData[enpiData.length-1][key];
  const diff=((latest/soll-1)*100);
  const kpiDef=KPI_DEF.find(k=>k.id===selKPI);
  const col=TRAEGER.find(t=>t.id===selTraeger)?.c||"var(--g)";

  // Durchschnitt je Periode
  const periodSlice=avgPeriod==="monat"?enpiData.slice(-1):avgPeriod==="quartal"?enpiData.slice(-3):enpiData;
  const avg=periodSlice.reduce((a,b)=>a+b[key],0)/periodSlice.length;
  const periodLbl=avgPeriod==="monat"?t("Monat","Month"):avgPeriod==="quartal"?t("Quartal","Quarter"):t("Jahr 2025","Year 2025");

  return h("div",{style:{padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}},
    h("div",{style:{display:"flex",alignItems:"flex-end",justifyContent:"space-between"}},
      h("div",null,
        h("div",{style:{fontSize:18,fontWeight:700}},t("Kennzahlen","KPIs")),
        h("div",{style:{fontSize:16,color:"var(--faint)",fontFamily:"var(--mono)",marginTop:2}},t("EnPI-Matrix · ISO 50001 Kap. 6.4 · Soll-Ist-Vergleich","EnPI matrix · ISO 50001 Sec. 6.4 · Target vs Actual"))),
      h("div",{style:{display:"flex",gap:6}},
        h("button",{className:"btn"},"↓ Export"),h("button",{className:"btn-b"},"In Report"))
    ),

    // Picker
    h("div",{style:{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}},
      h("div",{style:{display:"flex",gap:4}},
        TRAEGER.map(t=>h("button",{key:t.id,className:"btn"+(selTraeger===t.id?" active":""),onClick:()=>setSelTraeger(t.id)},t.l))),
      h("div",{style:{width:1,height:20,background:"var(--b)"}}),
      h("div",{style:{display:"flex",gap:4}},
        KPI_DEF.map(k=>h("button",{key:k.id,className:"btn"+(selKPI===k.id?" active":""),onClick:()=>setSelKPI(k.id)},k.label))),
      h("div",{style:{width:1,height:20,background:"var(--b)"}}),
      h("span",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".08em"}},t("Ø-Periode","Avg window")),
      h("div",{style:{display:"flex",gap:4}},
        [{id:"jahr",l:t("Jahr","Year")},{id:"quartal",l:t("Quartal","Quarter")},{id:"monat",l:t("Monat","Month")}].map(p=>
          h("button",{key:p.id,className:"btn"+(avgPeriod===p.id?" active":""),onClick:()=>setAvgPeriod(p.id)},p.l)))
    ),

    // EnPI summary cards (kompakt, klickbar für Ist/Soll-Detail)
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}},
      [
        {l:t("Akt. EnPI","Current EnPI"),v:latest.toFixed(1),u:kpiDef.unit,c:col,onC:()=>setDrillOpen("ist"),hint:t("Klick → Details","Click → details")},
        {l:t("Soll","Target"),v:soll.toFixed(1),u:kpiDef.unit,c:"var(--t2)",onC:()=>setDrillOpen("soll"),hint:t("Klick → Details","Click → details")},
        {l:t("Abweichung","Deviation"),v:(diff>=0?"+":"")+diff.toFixed(1),u:"%",c:diff<=0?"var(--g)":"var(--bl)"},
        {l:"Ø "+periodLbl,v:avg.toFixed(1),u:kpiDef.unit,c:"var(--t2)"}
      ].map((k,i)=>h("div",{key:i,className:"tile",onClick:k.onC,
        style:{padding:"10px 12px",cursor:k.onC?"pointer":"default",
          ...(k.onC?{borderColor:"rgba(16,185,129,.25)"}:{})}},
        h("div",{style:{fontFamily:"var(--mono)",fontSize:14,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".08em",lineHeight:1.1}},k.l),
        h("div",{style:{marginTop:4,fontFamily:"var(--mono)",display:"flex",alignItems:"baseline",gap:5}},
          h("span",{style:{fontSize:24,fontWeight:700,color:k.c,letterSpacing:"-.02em",lineHeight:1}},k.v),
          h("span",{style:{fontSize:14,color:"var(--faint)"}},k.u)),
        k.hint&&h("div",{style:{fontFamily:"var(--mono)",fontSize:13,color:"var(--faint)",marginTop:3,opacity:.7}},k.hint)))
    ),

    // Soll-Editor (Inline, togglable)
    h("div",{className:"tile",style:{padding:"10px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}},
      h("button",{className:"btn"+(editSoll?" active":""),onClick:()=>setEditSoll(!editSoll),
        style:{fontSize:15,padding:"5px 10px"}},"⚙ "+t("Sollwerte bearbeiten","Edit targets")),
      !editSoll&&h("span",{style:{fontSize:14,color:"var(--faint)",fontFamily:"var(--mono)"}},
        t("Aktive Sollwerte anpassen – wirkt auf Kacheln, Diagramm und Matrix.","Adjust active target values – affects cards, chart and matrix.")),
      editSoll&&TRAEGER.flatMap(tr=>KPI_DEF.map(k=>{
        const kk=tr.id+"-"+k.id;
        return h("label",{key:kk,style:{display:"inline-flex",alignItems:"center",gap:5,fontSize:14,fontFamily:"var(--mono)",color:"var(--t2)",background:"var(--s3)",padding:"3px 8px",borderRadius:3,border:"1px solid var(--sep)"}},
          h("span",{style:{color:tr.c,fontWeight:600}},tr.l.slice(0,3).toUpperCase()),
          h("span",{style:{color:"var(--faint)",fontSize:14}},k.unit.split("/")[1]||""),
          h("input",{type:"number",value:SOLL[kk],step:0.1,
            onChange:e=>setSOLL({...SOLL,[kk]:parseFloat(e.target.value)||0}),
            style:{width:58,fontSize:14,fontFamily:"var(--mono)",padding:"2px 4px",textAlign:"right",background:"var(--s2)",border:"1px solid var(--b)",color:"var(--t)"}}));
      })),
      editSoll&&h("button",{className:"btn",onClick:()=>{setSOLL(INITIAL_SOLL);},style:{fontSize:14,padding:"4px 8px"}},"↺ "+t("Reset","Reset"))
    ),

    // Drill-down panel by department
    drillOpen&&(()=>{
      const depts=[{n:"Produktion",pct:.58},{n:"Instandhaltung",pct:.17},{n:"Haustechnik",pct:.14},{n:"IT / Infrastruktur",pct:.07},{n:"Verwaltung",pct:.04}];
      const base=drillOpen==="ist"?latest:soll;
      return h("div",{className:"tile",style:{padding:14,borderColor:"rgba(16,185,129,.3)"}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
          h("div",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--g)",textTransform:"uppercase",letterSpacing:".1em"}},
            t("Aufschlüsselung nach Abteilungen · ","Breakdown by departments · ")+(drillOpen==="ist"?t("Istwert","Actual"):t("Sollwert","Target"))),
          h("button",{className:"btn",onClick:()=>setDrillOpen(null)},"× "+t("Schließen","Close"))),
        h("div",{style:{display:"grid",gridTemplateColumns:"minmax(140px,1.5fr) 80px minmax(0,1fr) 110px",columnGap:12,fontSize:15,fontFamily:"var(--mono)",color:"var(--faint)",textTransform:"uppercase",letterSpacing:".08em",paddingBottom:6,borderBottom:"1px solid var(--sep)"}},
          h("span",null,t("Abteilung","Department")),h("span",{style:{textAlign:"right"}},"%"),h("span",null,t("Anteil","Share")),h("span",{style:{textAlign:"right"}},kpiDef.unit)),
        depts.map((d,i)=>h("div",{key:i,style:{display:"grid",gridTemplateColumns:"minmax(140px,1.5fr) 80px minmax(0,1fr) 110px",columnGap:12,padding:"8px 0",borderBottom:i<depts.length-1?"1px solid var(--sep)":"none",alignItems:"center",fontSize:15}},
          h("span",{style:{color:"var(--t)"}},d.n),
          h("span",{style:{fontFamily:"var(--mono)",color:"var(--t2)",textAlign:"right"}},(d.pct*100).toFixed(0)+" %"),
          h("div",{style:{height:6,width:d.pct*160,background:"linear-gradient(90deg,"+col+",transparent)",borderRadius:3,opacity:.7}}),
          h("span",{style:{fontFamily:"var(--mono)",color:col,textAlign:"right"}},(base*d.pct).toFixed(1))))
      );
    })(),

    // Combo chart Ist + Soll
    h("div",{className:"tile",style:{padding:14}},
      h("div",{style:{fontFamily:"var(--mono)",fontSize:16,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}},kpiDef.label," · Soll-Ist 2025"),
      R.ResponsiveContainer&&h("div",{style:{height:280}},
        h(R.ResponsiveContainer,{width:"100%",height:"100%"},
          h(R.ComposedChart,{data:enpiData,margin:{top:4,right:8,bottom:0,left:0}},
            h(R.CartesianGrid,{strokeDasharray:"2 4",stroke:"var(--chart-grid)"}),
            h(R.XAxis,{dataKey:"m",tick:{fontSize:16,fill:"var(--faint)"}}),
            h(R.YAxis,{tick:{fontSize:16,fill:"var(--faint)"},unit:" "+kpiDef.unit.split("/")[0]}),
            h(R.Tooltip,{contentStyle:{background:"var(--chart-tt-bg)",border:"1px solid #243043",fontSize:16}}),
            h(R.Legend,{wrapperStyle:{fontSize:16,color:"var(--t2)"}}),
            h("defs",null,h("linearGradient",{id:"kpiFill",x1:"0",y1:"0",x2:"0",y2:"1"},
              h("stop",{offset:"5%",stopColor:col,stopOpacity:.4}),
              h("stop",{offset:"95%",stopColor:col,stopOpacity:0}))),
            h(R.Area,{type:"monotone",dataKey:key,name:"Ist",stroke:col,fill:"url(#kpiFill)",strokeWidth:2,dot:false}),
            h(R.ReferenceLine,{y:soll,stroke:"var(--bl)",strokeDasharray:"4 2",label:{value:t("Soll ","Target ")+soll.toFixed(1),fill:"var(--bl)",fontSize:15,position:"right"}}),
            h(R.ReferenceLine,{y:avg,stroke:"var(--faint)",strokeDasharray:"3 3",label:{value:"Ø "+periodLbl+" "+avg.toFixed(1),fill:"var(--faint)",fontSize:15,position:"left"}})
          )
        )
      )
    ),

    // Matrix-Tabelle alle Träger × alle KPIs — je KPI: IST | SOLL | Diff · mit Gruppen-Separatoren
    (()=>{
      const matRows=TRAEGER.map(tr=>{
        const row={id:tr.id,label:tr.l,color:tr.c};
        KPI_DEF.forEach(k=>{
          const kk=`${tr.id}-${k.id}`;
          const a=enpiData.reduce((s,d)=>s+d[kk],0)/enpiData.length;
          const s=SOLL[kk];
          row["ist_"+k.id]=a;
          row["soll_"+k.id]=s;
          row["dev_"+k.id]=(a/s-1)*100;
        });
        return row;
      });
      const sorted=[...matRows].sort((a,b)=>{
        const av=a[matSortKey], bv=b[matSortKey];
        if(typeof av==="number") return matSortDir*(av-bv);
        return matSortDir*String(av).localeCompare(String(bv));
      });
      // 10 Spalten: Träger | [IST SOLL Diff] × 3 · dazwischen dünne Trenn-Col für jede Gruppe
      // Layout-Strategy: verbreiterte Separatoren via background-Steifen auf der ersten Col jeder Gruppe
      const gridCols="minmax(150px,1.4fr) "+
        "repeat(3,[ist]minmax(86px,1fr) [soll]minmax(86px,1fr) [diff]minmax(90px,1fr))";
      const thStyle={padding:"12px 10px",borderBottom:"1px solid var(--b)",background:"var(--s3)",fontFamily:"var(--mono)",fontSize:14,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".08em",cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"};
      const thSub={padding:"8px 10px",borderBottom:"1px solid var(--b)",background:"var(--s3)",fontFamily:"var(--mono)",fontSize:14,color:"var(--faint)",textTransform:"uppercase",letterSpacing:".06em",cursor:"pointer",userSelect:"none",whiteSpace:"nowrap",textAlign:"right"};
      const arrow=(k)=>matSortKey===k?(matSortDir>0?" ▲":" ▼"):"";
      const toggle=(k)=>{ if(matSortKey===k) setMatSortDir(d=>-d); else { setMatSortKey(k); setMatSortDir(-1); } };
      const GROUP_BORDER="2px solid var(--b)"; // visuelle Trennung zwischen KPI-Gruppen
      return h("div",{className:"tile",style:{padding:14}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}},
          h("div",{style:{fontFamily:"var(--mono)",fontSize:15,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".1em"}},"EnPI-Übersichtsmatrix · Jahresschnitt 2025"),
          h("div",{style:{fontSize:14,color:"var(--faint)",fontFamily:"var(--mono)"}},t("Zeile klicken → Detail-Aufriss","Click row → drill-down"))),
        h("div",{style:{overflowX:"auto"}},
          h("div",{style:{display:"grid",gridTemplateColumns:gridCols,minWidth:980}},
            // ─── HEADER ROW 1: Gruppen-Header (KPI-Name über IST/SOLL/Diff) ───
            h("div",{onClick:()=>toggle("label"),style:{...thStyle,gridRow:"1 / span 2",display:"flex",alignItems:"center"}},"Energieträger"+arrow("label")),
            ...KPI_DEF.flatMap((k,gi)=>[
              h("div",{key:"grp_"+k.id,style:{...thStyle,gridColumn:"span 3",textAlign:"center",fontWeight:600,color:"var(--t)",borderLeft:gi>0?GROUP_BORDER:"none",borderBottom:"1px solid var(--sep)"}},k.label)
            ]),

// ---------- DIN 17463 Berechnungen ----------
// Kapitalwert (NPV) bei jährlich konstantem Cashflow
function npv(invest,cashflowYear,lifeYears,discountPct){
  const r=discountPct/100;
  let pv=0;
  for(let t=1;t<=lifeYears;t++) pv+=cashflowYear/Math.pow(1+r,t);
  return pv-invest;
}
// IRR (Newton-Approx) – sucht r, bei dem NPV=0
function irr(invest,cashflowYear,lifeYears){
  let r=0.1;
  for(let i=0;i<60;i++){
    let f=-invest,df=0;
    for(let t=1;t<=lifeYears;t++){
      const d=Math.pow(1+r,t);
      f+=cashflowYear/d;
      df+=-t*cashflowYear/(d*(1+r));
    }
    if(Math.abs(df)<1e-9)break;
    const nr=r-f/df;
    if(!isFinite(nr)||nr<-0.99){r=-0.5;break;}
    if(Math.abs(nr-r)<1e-6){r=nr;break;}
    r=nr;
  }
  return r*100;
}
// ROI (statisch, ges. Laufzeit)
function roi(invest,cashflowYear,lifeYears){
  return ((cashflowYear*lifeYears-invest)/invest)*100;
}
// Amortisationsdauer (statisch)
function payback(invest,cashflowYear){
  return cashflowYear>0?invest/cashflowYear:Infinity;
}
